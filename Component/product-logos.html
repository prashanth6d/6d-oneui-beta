<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Product Logos" subtitle="6D product wordmarks (transparent PNG)" viewport="760x420" --><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;background:var(--surface-0);font-family:var(--font);color:var(--ink-900)}
  .wrap{padding:var(--space-4)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}
  .cell{border:1px solid var(--line-100);border-radius:var(--radius-lg);background:var(--surface-0);
    padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;align-items:center;gap:var(--space-3);box-sizing:border-box}
  .cell img{height:38px;width:auto;max-width:100%;object-fit:contain}
  .cell .name{font-size:11px;font-weight:500;color:var(--field-label);letter-spacing:.02em}
  .cell .name code{font-family:var(--font-mono,monospace);font-size:11px;color:var(--ink-500,#6D6D6D)}
</style></head><body>
<div class="wrap">
  <div class="grid">
    <div class="cell"><img src="../assets/products/aureus.png" alt="Aureus"><span class="name"><code>aureus.png</code></span></div>
    <div class="cell"><img src="../assets/products/canvas.png" alt="Canvas"><span class="name"><code>canvas.png</code></span></div>
    <div class="cell"><img src="../assets/products/echelon.png" alt="Echelon"><span class="name"><code>echelon.png</code></span></div>
    <div class="cell"><img src="../assets/products/engrafi.png" alt="Engrafi"><span class="name"><code>engrafi.png</code></span></div>
    <div class="cell"><img src="../assets/products/infinity.png" alt="Infinity"><span class="name"><code>infinity.png</code></span></div>
    <div class="cell"><img src="../assets/products/magik.png" alt="Magik"><span class="name"><code>magik.png</code></span></div>
    <div class="cell"><img src="../assets/products/mercado.png" alt="Mercado"><span class="name"><code>mercado.png</code></span></div>
    <div class="cell"><img src="../assets/products/ventas.png" alt="Ventas"><span class="name"><code>ventas.png</code></span></div>
  </div>
</div></body></html>
