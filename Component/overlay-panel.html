<!DOCTYPE html>
<!-- @dsCard group="Components" name="Overlay Panel" subtitle="Right slide-in overlay on a dimmed scrim — fixed header + footer, scrolling 12-grid body, content-adaptive width (10/8/4/3 desktop · 100% tablet & mobile)" viewport="960x620" --><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-50);color:var(--ink-900)}

  /* ---- scrim: dimmed backdrop behind the panel (MANDATORY) ----
     --glass-dark is ink-900 @55% (a translucency of an existing token, NOT a new
     color). Sits at --z-scrim, one layer below the panel's --z-drawer. Clicking
     the scrim is NOT a dismiss affordance — the panel dismisses via Cancel only. */
  .scrim{position:fixed;inset:0;background:var(--glass-dark);z-index:var(--z-scrim)}
  @media (prefers-reduced-motion: no-preference){
    .scrim{animation:scrimIn var(--dur-5) var(--ease-out) both}
    .scrim.closing{animation:scrimOut var(--dur-5) var(--ease-in) forwards}
  }
  @keyframes scrimIn{from{opacity:0}to{opacity:1}}
  @keyframes scrimOut{from{opacity:1}to{opacity:0}}

  /* ============================================================================
     OVERLAY PANEL — right-to-left slide-in
     • Header & footer are FIXED (flex:none); only the body scrolls.
     • Body is a 12-column grid — compose content with .ds-col-N spans.
     • Width is CONTENT-ADAPTIVE, expressed as a span of the 12-col device width:
         more content  → .w-10 / .w-8   (data-heavy overlays)
         less content  → .w-4  / .w-3   (compact forms, detail peeks)
       Tablet (≤1023) and mobile (≤767) ALWAYS render at 100% width, full-bleed,
       with the body grid intact.
     ========================================================================== */
  .panel{position:fixed;top:10px;right:10px;height:calc(100vh - 20px);
         background:var(--surface-0);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
         display:flex;flex-direction:column;overflow:hidden;z-index:var(--z-drawer);
         width:calc(100% * 8 / 12)}
  /* content-adaptive width variants (fraction of the 12-col device width) */
  .panel.w-10{width:calc(100% * 10 / 12)}
  .panel.w-8 {width:calc(100% * 8 / 12)}
  .panel.w-4 {width:calc(100% * 4 / 12)}
  .panel.w-3 {width:calc(100% * 3 / 12)}

  @media (prefers-reduced-motion: no-preference){
    .panel{animation:slideIn var(--dur-5) var(--ease-out) both}
    .panel.closing{animation:slideOut var(--dur-5) var(--ease-in) forwards}
  }
  @keyframes slideIn{from{transform:translateX(calc(100% + 10px))}to{transform:translateX(0)}}
  @keyframes slideOut{from{transform:translateX(0)}to{transform:translateX(calc(100% + 10px))}}

  /* ---- header: 60px, FIXED, heading + sub-heading, bottom drop shadow (NO close icon) ---- */
  .o-head{flex:none;height:60px;display:flex;align-items:center;gap:var(--space-3);
          padding:0 var(--space-5);background:var(--surface-0);position:relative;z-index:2;
          box-shadow:0 1px 4px rgba(0,0,0,0.05)}
  .o-head .titles{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;flex:1}
  .o-title{font-size:var(--t-page-title);line-height:28px;font-weight:500;color:var(--ink-900);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .o-sub{font-size:var(--t-small);line-height:16px;color:var(--ink-600);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- body: the ONLY scrolling region, 30px padding, 12-col grid ---- */
  /* container-type makes spans respond to the PANEL's own width — so a narrow
     .w-3 / .w-4 desktop panel collapses just like the full-width mobile panel. */
  .o-body{flex:1;min-height:0;overflow-y:auto;padding:var(--space-5);container-type:inline-size;
          display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--grid-gutter);align-content:start}
  /* responsive body spans — compose content with these, never raw span-N */
  .o-col-12{grid-column:span 12}
  .o-col-6 {grid-column:span 6}
  .o-col-4 {grid-column:span 4}
  .o-col-3 {grid-column:span 3}
  /* medium container (≤640px): thirds/quarters become halves */
  @container (max-width:640px){
    .o-col-4,.o-col-3{grid-column:span 6}
  }
  /* narrow container (≤420px): everything stacks full-width */
  @container (max-width:420px){
    .o-col-12,.o-col-6,.o-col-4,.o-col-3{grid-column:span 12}
  }

  /* ---- footer: 56px, FIXED, Cancel left / primary right ---- */
  .o-foot{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);
          padding:0 var(--space-5);background:var(--line-100)}
  /* ---- footer buttons: aligned to the Button style guide (Component/buttons.html) ---- */
  .btn{font-size:12px;font-weight:500;line-height:1;border-radius:var(--radius-sm);padding:9px 14px;
       min-width:80px;border:1px solid transparent;cursor:pointer;font-family:inherit;
       display:inline-flex;align-items:center;justify-content:center}
  /* Cancel = Tertiary variant */
  .btn.ghost{background:var(--surface-0);color:var(--ink-900);border-color:var(--line-200)}
  .btn.ghost:hover{border-color:var(--ink-400);box-shadow:var(--shadow-md)}
  /* Submit = Primary variant */
  .btn.primary{background:var(--blue-500);color:var(--surface-0)}
  .btn.primary:hover{background:var(--blue-600)}

  /* ---- tablet & mobile: ALWAYS 100% width, full-bleed, 12-grid body intact ---- */
  @media (max-width:1023px){
    .panel,.panel.w-10,.panel.w-8,.panel.w-4,.panel.w-3{
      top:0;right:0;width:100%;height:100vh;border-radius:0}
    .o-head,.o-foot{padding-inline:var(--space-3)}
    .o-body{padding:var(--space-3)}
  }

  /* demo-only: width switcher (not part of the component) */
  .demo{position:fixed;top:16px;left:16px;display:flex;gap:6px;z-index:2}
  .demo button{font-family:var(--font-ui);font-size:11px;font-weight:500;color:#fff;
               background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
               border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer}
  .demo button.on{background:var(--blue-500);border-color:var(--blue-500)}
  /* demo placeholder blocks */
  .ph{background:var(--primary-50);border:1px solid var(--line-100);border-radius:var(--radius-md);
      height:64px;display:flex;align-items:center;padding:0 14px;font-size:var(--t-small);color:var(--ink-600)}
</style></head><body>
  <div class="demo" id="demo">
    <button type="button" data-w="w-10">10 grid</button>
    <button type="button" data-w="w-8" class="on">8 grid</button>
    <button type="button" data-w="w-4">4 grid</button>
    <button type="button" data-w="w-3">3 grid</button>
  </div>

  <!-- MANDATORY dimmed scrim behind the panel -->
  <div class="scrim" id="scrim"></div>

  <div class="panel w-8" id="panel">
    <!-- FIXED header -->
    <div class="o-head">
      <div class="titles">
        <div class="o-title">Overlay Heading</div>
        <div class="o-sub">Overlay description will be shown here</div>
      </div>
    </div>

    <!-- SCROLLING body — 12-column grid. Populate with .ds-col-N children for a real screen.
         The panel width should be chosen from the content volume:
           data-heavy → w-10 / w-8   ·   compact → w-4 / w-3   ·   ≤1023px → 100%. -->
    <div class="o-body" id="body">
      <div class="ph o-col-12">Body scrolls · header &amp; footer stay fixed</div>
      <div class="ph o-col-6">span 6</div>
      <div class="ph o-col-6">span 6</div>
      <div class="ph o-col-4">span 4</div>
      <div class="ph o-col-4">span 4</div>
      <div class="ph o-col-4">span 4</div>
      <div class="ph o-col-12">span 12</div>
      <div class="ph o-col-6">span 6</div>
      <div class="ph o-col-6">span 6</div>
      <div class="ph o-col-12">span 12</div>
      <div class="ph o-col-12">span 12</div>
    </div>

    <!-- FIXED footer -->
    <div class="o-foot">
      <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
      <button class="btn primary" type="button">Submit</button>
    </div>
  </div>

<script>
  const panel = document.getElementById('panel');
  const scrim = document.getElementById('scrim');
  document.getElementById('cancelBtn').addEventListener('click', ()=>{ panel.classList.add('closing'); scrim.classList.add('closing'); });

  // demo-only width switcher
  const demo = document.getElementById('demo');
  demo.addEventListener('click', e=>{
    const b = e.target.closest('button[data-w]'); if(!b) return;
    panel.classList.remove('w-10','w-8','w-4','w-3','closing');
    panel.classList.add(b.dataset.w);
    demo.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
  });
</script>
</body></html>
