<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="Tight 4·5·8·10·16·20·30 base" viewport="700x130" --><html lang="en"><head><meta charset="utf-8">

<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0)}
  .card{padding:22px;display:flex;gap:var(--space-3);align-items:flex-end}
  .sw{text-align:center}
  .bar{background:var(--blue-tint-15);border-left:2px solid var(--blue-500);height:34px}
  .nm{font-size:11px;font-weight:600;color:var(--ink-900);margin-top:var(--space-2)}
  .v{font-size:10px;color:var(--ink-400)}
</style></head><body>
<div class="card">
  <div class="sw"><div class="bar" style="width:4px"></div><div class="nm">1</div><div class="v">4</div></div>
  <div class="sw"><div class="bar" style="width:8px"></div><div class="nm">2</div><div class="v">8</div></div>
  <div class="sw"><div class="bar" style="width:16px"></div><div class="nm">3</div><div class="v">16</div></div>
  <div class="sw"><div class="bar" style="width:20px"></div><div class="nm">4</div><div class="v">20</div></div>
  <div class="sw"><div class="bar" style="width:30px"></div><div class="nm">5</div><div class="v">30</div></div>
  <div style="margin-left:auto;align-self:center;text-align:right;max-width:200px">
    <div style="font-size:12px;font-weight:600;color:var(--ink-900)">4 · 8 · 16 base</div>
    <div style="font-size:11px;color:var(--ink-600);margin-top:4px">Card padding 20–30px · component padding 16px · 12-col grid, 24px gutter · 60px margin</div>
  </div>
</div></body></html>
