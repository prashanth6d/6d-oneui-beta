<!-- @dsCard group="Components" title="To-do List" def="A to-do list groups tasks into an Active section and a collapsible Completed section. Ticking an active task's checkbox moves it into Completed (and un-ticking returns it to Active). Each task is a single compact 12px line; the card is responsive across all breakpoints and aligns to the 12-column grid." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-100);color:var(--ink-900)}

  /* ---- 12-column grid stage (20px gutters) ---- */
  .stage{padding:24px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px 20px}
  .cell{grid-column:span 12}                                   /* xxs / xs — full width */
  @media (min-width:48rem){ .cell{grid-column:span 6} }        /* sm  — half */
  @media (min-width:64rem){ .cell{grid-column:span 4} }        /* md  — third */
  @media (min-width:90rem){ .cell{grid-column:span 3} }        /* lg+ — quarter */

  /* ================= TO-DO CARD ================= */
  .todo{background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-md);
        box-shadow:var(--shadow-sm);padding:var(--space-3)}

  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin:0 0 8px}
  .sec-head .lbl{font:var(--t-label);color:var(--ink-900)}     /* 12px / 600 */
  .sec-head .chev{width:22px;height:22px;border:0;background:none;cursor:pointer;border-radius:var(--radius-sm);
        display:flex;align-items:center;justify-content:center;color:var(--ink-600)}
  .sec-head .chev:hover{background:var(--surface-50);color:var(--ink-900)}
  .sec-head .chev svg{width:14px;height:14px;transition:transform .25s ease}

  .sec + .sec{margin-top:var(--space-3)}

  /* task list */
  .list{display:flex;flex-direction:column;gap:var(--space-2)}

  /* a task row — single compact line */
  .task{display:flex;align-items:center;gap:10px;padding:9px 12px;
        border:1px solid var(--line-100);border-radius:var(--radius-sm);background:var(--surface-0);
        transition:opacity .25s ease,transform .25s ease,border-color .15s ease,background .15s ease}
  .task:hover{border-color:var(--line-200)}
  .task.leaving{opacity:0;transform:translateX(10px)}
  .task.entering{opacity:0;transform:translateY(-6px)}

  /* DS checkbox — 18px box, 4px radius, blue-500 fill, white tick */
  .box{width:18px;height:18px;flex:none;border-radius:var(--radius-sm);
       border:1.5px solid var(--line-200);background:var(--surface-0);cursor:pointer;padding:0;
       display:grid;place-items:center;transition:background .15s ease,border-color .15s ease}
  .box:hover{border-color:var(--ink-400)}
  .box.on{background:var(--blue-500);border-color:var(--blue-500)}
  .box svg{width:11px;height:11px;transform:scale(0);transition:transform .15s ease}
  .box.on svg{transform:scale(1)}

  .t-title{font:var(--t-body-med);color:var(--ink-900);min-width:0;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}  /* 12px / 500 */

  /* completed task styling */
  .task.done{background:var(--blue-tint-08);border-color:transparent}
  .task.done .t-title{color:var(--ink-600)}

  /* collapsible body for the completed section */
  .collapse{overflow:hidden;transition:max-height .3s ease,opacity .25s ease;max-height:1200px;opacity:1}
  .sec.collapsed .collapse{max-height:0;opacity:0}
  .sec.collapsed .chev svg{transform:rotate(180deg)}

  /* empty state */
  .empty{font:var(--t-body);color:var(--ink-400);padding:10px 12px;
         border:1px dashed var(--line-200);border-radius:var(--radius-sm);text-align:center;display:none}
  .list:empty + .empty{display:block}
  .box svg{stroke:var(--surface-0)}
</style></head><body>
<div class="stage">
  <div class="grid">
    <div class="cell">

      <div class="todo">

        <!-- ACTIVE -->
        <div class="sec">
          <div class="sec-head"><span class="lbl">Active Tasks</span></div>
          <div class="list" id="activeList">

            <div class="task" data-task>
              <button class="box" role="checkbox" aria-checked="false" aria-label="Mark Approve Creators complete">
                <svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
              <span class="t-title">Approve Creators</span>
            </div>

            <div class="task" data-task>
              <button class="box" role="checkbox" aria-checked="false" aria-label="Mark Ship Product to Bessie Cooper complete">
                <svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
              <span class="t-title">Ship Product to Bessie Cooper</span>
            </div>

            <div class="task" data-task>
              <button class="box" role="checkbox" aria-checked="false" aria-label="Mark Review ad by Bessie Cooper complete">
                <svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
              <span class="t-title">Review ad by Bessie Cooper</span>
            </div>

            <div class="task" data-task>
              <button class="box" role="checkbox" aria-checked="false" aria-label="Mark Ship Product to Ralph Edwards complete">
                <svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
              <span class="t-title">Ship Product to Ralph Edwards</span>
            </div>

            <div class="task" data-task>
              <button class="box" role="checkbox" aria-checked="false" aria-label="Mark Review ad by Ralph Edwards complete">
                <svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
              <span class="t-title">Review ad by Ralph Edwards</span>
            </div>

          </div>
          <div class="empty">No active tasks — nicely done.</div>
        </div>

        <!-- COMPLETED -->
        <div class="sec" id="doneSec">
          <div class="sec-head">
            <span class="lbl">Completed Tasks</span>
            <button class="chev" id="toggleDone" aria-label="Collapse completed tasks" aria-expanded="true">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
            </button>
          </div>
          <div class="collapse">
            <div class="list" id="doneList">

              <div class="task done" data-task>
                <button class="box on" role="checkbox" aria-checked="true" aria-label="Mark Review ad by Bessie Cooper active">
                  <svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
                <span class="t-title">Review ad by Bessie Cooper</span>
              </div>

              <div class="task done" data-task>
                <button class="box on" role="checkbox" aria-checked="true" aria-label="Mark Ship Product to Ralph Edwards active">
                  <svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
                <span class="t-title">Ship Product to Ralph Edwards</span>
              </div>

              <div class="task done" data-task>
                <button class="box on" role="checkbox" aria-checked="true" aria-label="Mark Review ad by Ralph Edwards active">
                  <svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
                <span class="t-title">Review ad by Ralph Edwards</span>
              </div>

            </div>
            <div class="empty">No completed tasks yet.</div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
(function(){
  const activeList = document.getElementById('activeList');
  const doneList   = document.getElementById('doneList');

  function move(task, toDone){
    task.classList.add('leaving');
    setTimeout(()=>{
      const box = task.querySelector('.box');
      if(toDone){
        task.classList.add('done'); box.classList.add('on'); box.setAttribute('aria-checked','true');
        doneList.appendChild(task);
      } else {
        task.classList.remove('done'); box.classList.remove('on'); box.setAttribute('aria-checked','false');
        activeList.appendChild(task);
      }
      task.classList.remove('leaving');
      task.classList.add('entering');
      requestAnimationFrame(()=>requestAnimationFrame(()=>task.classList.remove('entering')));
    }, 260);
  }

  document.querySelectorAll('[data-task] .box').forEach(box=>{
    box.addEventListener('click', ()=>{
      const task = box.closest('[data-task]');
      move(task, !task.classList.contains('done'));
    });
  });

  // collapse / expand completed section
  const sec = document.getElementById('doneSec');
  const btn = document.getElementById('toggleDone');
  btn.addEventListener('click', ()=>{
    const collapsed = sec.classList.toggle('collapsed');
    btn.setAttribute('aria-expanded', String(!collapsed));
    btn.setAttribute('aria-label', (collapsed?'Expand':'Collapse') + ' completed tasks');
  });
})();
</script>
</body></html>
