<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Primary blue" subtitle="Primary blue ramp + orange AI accent — swatch cards with contrast, HEX/RGBA + usage notes" viewport="780x580" --><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-50);color:var(--ink-900)}
  .cc-page{padding:24px}
  .cc-section{margin-bottom:28px}
  .cc-section:last-child{margin-bottom:0}
  .cc-h{margin:0 0 16px;font-size:22px;font-weight:600;letter-spacing:-.01em}
  .cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .cc{background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-md);padding:10px;box-shadow:var(--shadow-xs)}
  .cc-fill{position:relative;height:120px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .cc-badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
  .cc-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:var(--radius-pill);background:rgba(255,255,255,.92);color:var(--ink-900);font-size:10px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cc-dot{width:13px;height:13px;border-radius:50%;flex:none}
  .cc-dot.dark{background:#000}
  .cc-dot.light{background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .cc-name{margin:10px 2px 6px;font-size:14px;font-weight:600;line-height:20px}
  .cc-meta{margin:0 2px;font-size:11px;line-height:16px;color:var(--ink-400);font-variant-numeric:tabular-nums}
  .cc-hex{color:var(--ink-600);text-transform:uppercase}
  .cc-use{margin:8px 2px 2px;padding-top:7px;border-top:1px solid var(--line-100);font-size:11px;line-height:15px;color:var(--ink-600)}
  .cc-grad{overflow:hidden}
  .cc-stops{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:4px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
  .cc-stops.dark{color:var(--ink-900);text-shadow:none}
  .cc-stops span{display:flex;align-items:center;gap:6px}
  .cc-stopdot{width:10px;height:10px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
</style></head><body>
<div id="palette" class="cc-page"></div>
<script>
window.PALETTE=[{title:"Primary blue",colors:[
  {name:"Primary",hex:"#0099FF",use:"Primary actions, links, active tabs and selection."},
  {name:"Primary+ (hover)",hex:"#0578BE",use:"Hover / pressed state of primary buttons and links."},
  {name:"Focus / Tint Border",hex:"#BAE4FF",use:"Focus rings and tinted input borders."},
  {name:"Primary Light",hex:"#F1F8FF",use:"Tinted surfaces — header band, hover rows, selected menu."},
  {name:"Orange (AI accent)",hex:"#EE743B",use:"AI accent highlight on AARYA surfaces."}
]}];
</script>
<script src="color-card-render.js"></script>
</body></html>
