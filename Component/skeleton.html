<!-- @dsCard group="Components" title="Skeleton" def="A skeleton acts as a placeholder for content, usually while the content loads." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .card{padding:28px 24px;display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:30px 32px;align-items:start;max-width:880px}
  .panel{display:flex;flex-direction:column;gap:14px}
  .cap{font-size:10px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.05em}
  .box{border:1px solid var(--line-100);border-radius:var(--radius-md);padding:var(--space-3)}

  /* ---- Skeleton primitive ---- */
  .sk{position:relative;overflow:hidden;background:var(--line-100);border-radius:var(--radius-sm)}
  .sk.circ{border-radius:50%}
  .sk.line{height:11px}
  .sk.pill{border-radius:var(--radius-pill)}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
             background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
             animation:shimmer 1.3s infinite}
  @keyframes shimmer{100%{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){.sk::after{animation:none}}

  .lines{display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1}
</style></head><body>
<div class="card">

  <!-- TEXT LINES -->
  <div class="panel">
    <div class="cap">Text block</div>
    <div class="box lines">
      <span class="sk line" style="width:100%"></span>
      <span class="sk line" style="width:96%"></span>
      <span class="sk line" style="width:88%"></span>
      <span class="sk line" style="width:60%"></span>
    </div>
  </div>

  <!-- HEADING + TEXT -->
  <div class="panel">
    <div class="cap">Heading + paragraph</div>
    <div class="box lines">
      <span class="sk" style="width:55%;height:16px"></span>
      <span class="sk line" style="width:100%;margin-top:4px"></span>
      <span class="sk line" style="width:92%"></span>
      <span class="sk line" style="width:70%"></span>
    </div>
  </div>

  <!-- LIST ITEM (avatar + text) -->
  <div class="panel">
    <div class="cap">List item</div>
    <div class="box lines">
      <div class="row">
        <span class="sk circ" style="width:40px;height:40px;flex:none"></span>
        <div class="lines grow"><span class="sk line" style="width:60%"></span><span class="sk line" style="width:40%"></span></div>
      </div>
      <div class="row">
        <span class="sk circ" style="width:40px;height:40px;flex:none"></span>
        <div class="lines grow"><span class="sk line" style="width:70%"></span><span class="sk line" style="width:45%"></span></div>
      </div>
      <div class="row">
        <span class="sk circ" style="width:40px;height:40px;flex:none"></span>
        <div class="lines grow"><span class="sk line" style="width:52%"></span><span class="sk line" style="width:38%"></span></div>
      </div>
    </div>
  </div>

  <!-- MEDIA CARD -->
  <div class="panel">
    <div class="cap">Media card</div>
    <div class="box lines">
      <span class="sk" style="width:100%;height:120px;border-radius:var(--radius-md)"></span>
      <span class="sk line" style="width:70%;height:14px;margin-top:4px"></span>
      <span class="sk line" style="width:100%"></span>
      <span class="sk line" style="width:85%"></span>
      <div class="row" style="margin-top:6px"><span class="sk pill" style="width:74px;height:26px"></span><span class="sk pill" style="width:74px;height:26px"></span></div>
    </div>
  </div>

  <!-- TABLE ROWS -->
  <div class="panel" style="grid-column:1 / -1">
    <div class="cap">Table rows</div>
    <div class="box lines">
      <div class="row"><span class="sk line" style="width:22%"></span><span class="sk line" style="width:16%"></span><span class="sk line" style="width:14%"></span><span class="sk line grow"></span><span class="sk pill" style="width:64px;height:22px;flex:none"></span></div>
      <div class="row"><span class="sk line" style="width:22%"></span><span class="sk line" style="width:16%"></span><span class="sk line" style="width:14%"></span><span class="sk line grow"></span><span class="sk pill" style="width:64px;height:22px;flex:none"></span></div>
      <div class="row"><span class="sk line" style="width:22%"></span><span class="sk line" style="width:16%"></span><span class="sk line" style="width:14%"></span><span class="sk line grow"></span><span class="sk pill" style="width:64px;height:22px;flex:none"></span></div>
      <div class="row"><span class="sk line" style="width:22%"></span><span class="sk line" style="width:16%"></span><span class="sk line" style="width:14%"></span><span class="sk line grow"></span><span class="sk pill" style="width:64px;height:22px;flex:none"></span></div>
    </div>
  </div>

  <!-- SHAPES -->
  <div class="panel" style="grid-column:1 / -1">
    <div class="cap">Shapes</div>
    <div class="box row" style="gap:20px;align-items:center;flex-wrap:wrap">
      <span class="sk circ" style="width:48px;height:48px"></span>
      <span class="sk" style="width:48px;height:48px;border-radius:8px"></span>
      <span class="sk pill" style="width:120px;height:28px"></span>
      <span class="sk line" style="width:160px"></span>
      <span class="sk" style="width:90px;height:90px;border-radius:var(--radius-md)"></span>
    </div>
  </div>

</div>
</body></html>
