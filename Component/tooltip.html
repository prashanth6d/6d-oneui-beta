<!-- @dsCard group="Components" title="Tooltip" def="A tooltip briefly describes an interactive element on mouse hover or keyboard focus." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .card{padding:40px 32px;display:flex;flex-direction:column;gap:40px;max-width:760px}
  .sec{display:flex;flex-direction:column;gap:18px}
  .cap{font-size:10px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

  /* sample targets */
  .tgt{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:34px;padding:0 14px;
       border:1px solid var(--line-200);border-radius:var(--radius-sm);background:var(--surface-0);color:var(--ink-900);
       font-size:12px;font-weight:500;cursor:default}
  .tgt:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px}
  .ico{width:34px;height:34px;padding:0;border-radius:var(--radius-sm)}
  .ico svg{width:16px;height:16px;color:var(--ink-600)}

  /* ---- Tooltip ---- */
  .tooltip{position:fixed;z-index:9999;max-width:240px;background:var(--ink-900);color:var(--surface-0);
           font-size:11px;line-height:15px;font-weight:500;padding:6px 10px;border-radius:var(--radius-sm);
           pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity .14s ease,transform .14s ease;
           text-wrap:pretty}
  .tooltip.show{opacity:1;transform:translateY(0)}
  .tooltip::after{content:"";position:absolute;width:8px;height:8px;background:var(--ink-900);transform:rotate(45deg)}
  .tooltip.pos-top::after{bottom:-3px;left:var(--ax,50%);margin-left:-4px}
  .tooltip.pos-bottom::after{top:-3px;left:var(--ax,50%);margin-left:-4px}
  .tooltip.pos-left::after{right:-3px;top:var(--ay,50%);margin-top:-4px}
  .tooltip.pos-right::after{left:-3px;top:var(--ay,50%);margin-top:-4px}
</style></head><body>
<div class="card">

  <!-- POSITIONS -->
  <div class="sec">
    <div class="cap">Positions (hover or tab to focus)</div>
    <div class="row">
      <button class="tgt" data-tip="Add a new SIM batch" data-pos="top">Top</button>
      <button class="tgt" data-tip="Add a new SIM batch" data-pos="bottom">Bottom</button>
      <button class="tgt" data-tip="Add a new SIM batch" data-pos="left">Left</button>
      <button class="tgt" data-tip="Add a new SIM batch" data-pos="right">Right</button>
    </div>
  </div>

  <!-- ICONS -->
  <div class="sec">
    <div class="cap">On icon buttons</div>
    <div class="row">
      <button class="tgt ico" data-tip="Refresh" data-pos="top"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg></button>
      <button class="tgt ico" data-tip="Download usage report" data-pos="top"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
      <button class="tgt ico" data-tip="Filter list" data-pos="top"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 3H2l8 9.5V19l4 2v-8.5L22 3z"/></svg></button>
      <button class="tgt ico" data-tip="More options" data-pos="top"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </div>
  </div>

  <!-- LONG CONTENT (240px wrap) -->
  <div class="sec">
    <div class="cap">Long content wraps at 240px</div>
    <div class="row">
      <button class="tgt" data-tip="This SIM is locked to a single device IMEI. Unlock it from the device settings before reassigning it to another subscriber." data-pos="bottom">Locked SIM</button>
    </div>
  </div>

</div>

<div class="tooltip" id="tooltip" role="tooltip"></div>

<script>
  const tt = document.getElementById('tooltip');
  const SHOW_DELAY = 300, HIDE_DELAY = 200;
  let showTimer=null, hideTimer=null, current=null;

  function clearTimers(){ clearTimeout(showTimer); clearTimeout(hideTimer); showTimer=hideTimer=null; }

  function place(target, pos){
    const r = target.getBoundingClientRect();
    const w = tt.offsetWidth, h = tt.offsetHeight, gap = 8, vw = innerWidth, vh = innerHeight;
    let x, y;
    if(pos==='bottom'){ x=r.left+r.width/2-w/2; y=r.bottom+gap; }
    else if(pos==='left'){ x=r.left-w-gap; y=r.top+r.height/2-h/2; }
    else if(pos==='right'){ x=r.right+gap; y=r.top+r.height/2-h/2; }
    else { x=r.left+r.width/2-w/2; y=r.top-h-gap; } // top (default)
    // clamp into viewport
    const cx=Math.max(4,Math.min(x,vw-w-4)), cy=Math.max(4,Math.min(y,vh-h-4));
    tt.style.left=cx+'px'; tt.style.top=cy+'px';
    // arrow alignment to target centre
    if(pos==='left'||pos==='right'){ tt.style.setProperty('--ay',(r.top+r.height/2-cy)+'px'); }
    else { tt.style.setProperty('--ax',(r.left+r.width/2-cx)+'px'); }
  }

  function show(target){
    const pos = target.dataset.pos||'top';
    tt.textContent = target.dataset.tip;
    tt.className = 'tooltip pos-'+pos;
    // measure off-screen first
    tt.style.left='-9999px'; tt.style.top='0';
    requestAnimationFrame(()=>{ place(target,pos); tt.classList.add('show'); });
    current = target;
  }
  function hideNow(){ clearTimers(); tt.classList.remove('show'); current=null; }

  function onEnter(e){
    const target = e.currentTarget;
    clearTimeout(hideTimer); hideTimer=null;
    // moving back onto the SAME target — keep it
    if(current===target){ return; }
    // hovering/focusing ANOTHER tooltip target — dismiss current immediately
    if(current && current!==target){ tt.classList.remove('show'); current=null; }
    clearTimeout(showTimer);
    showTimer = setTimeout(()=>show(target), SHOW_DELAY);
  }
  function onLeave(){
    clearTimeout(showTimer); showTimer=null;
    hideTimer = setTimeout(()=>{ tt.classList.remove('show'); current=null; }, HIDE_DELAY);
  }

  document.querySelectorAll('[data-tip]').forEach(t=>{
    t.addEventListener('mouseenter', onEnter);
    t.addEventListener('mouseleave', onLeave);
    t.addEventListener('focus', onEnter);
    t.addEventListener('blur', onLeave);
  });
  // disappear immediately on scroll
  window.addEventListener('scroll', hideNow, true);
</script>
</body></html>
