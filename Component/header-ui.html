<!DOCTYPE html>
<!-- @dsCard group="Components" name="Header UI" subtitle="Title+subtext in bar, gradient search w/ mic, revised profile dropdown" viewport="1200x320" --><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-50);color:var(--ink-900)}
  .stage{position:relative;width:100%}

  /* ---- header bar (fully responsive: fills any width, never overflows) ---- */
  .header{width:100%;height:var(--header-h);box-sizing:border-box;background:var(--blue-100);border-bottom:1px solid var(--line-100);
          box-shadow:var(--shadow-xs);display:flex;align-items:center;gap:24px;padding:0 0 0 28px}
  .vdiv{width:1px;height:48px;background:var(--line-100);flex:none}

  /* hamburger — hidden on desktop, shown on small screens to toggle the Left Menu */
  .hamburger{display:none;flex:none;width:40px;height:40px;margin-right:-8px;border:0;background:transparent;
             border-radius:var(--radius-md);cursor:pointer;place-items:center;color:var(--ink-700)}
  .hamburger:hover{background:var(--surface-100)}
  .hamburger svg{width:22px;height:22px}

  /* title + subtext, LEFT-aligned — never grows, truncates, never pushes the right group off-screen */
  .titleblock{flex:0 1 auto;max-width:520px;min-width:0}
  .titleblock h1{margin:0;font:var(--t-page-title);color:var(--ink-900);letter-spacing:-0.01em;
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titleblock p{margin:2px 0 0;font:var(--t-small);font-size:12px;color:var(--ink-600);
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* elastic spacer — always grows to pin the right group (search/CTAs/user) to the right edge, any width */
  .spacer{flex:1 1 auto;min-width:16px}

  /* gradient smart search (OPTIONAL — add on request only) */
  .search{flex:0 1 280px;width:280px;min-width:150px;display:flex;align-items:center;gap:12px;height:40px;
          border-radius:var(--radius-pill);padding:0 3px 0 10px;
          background:linear-gradient(90deg,var(--purple-600) 0%,var(--blue-500) 100%);box-shadow:var(--shadow-sm)}
  .search>svg{width:18px;height:18px;flex:none;color:var(--surface-0);opacity:.95}
  .search.recording>svg{display:none}
  .search input{border:0;outline:0;flex:1;font:var(--t-body);font-size:13px;font-family:var(--font-ui);
                color:var(--surface-0);background:transparent}
  .search input::placeholder{color:rgba(255,255,255,.82)}
  .mic{flex:none;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
       background:rgba(255,255,255,.22);display:grid;place-items:center;color:var(--surface-0);transition:background .15s}
  .mic:hover{background:rgba(255,255,255,.34)}
  .mic svg{width:17px;height:17px}
  /* active voice/recording state — solid white "stop" button */
  .mic.recording{background:var(--surface-0)}
  .mic.recording:hover{background:var(--surface-0)}
  .mic .ic-stop{display:none}
  .mic.recording .ic-mic{display:none}
  .mic.recording .ic-stop{display:block;color:var(--purple-600)}

  /* voice waveform — fills the full width of the search bar */
  .wave{display:none;align-items:center;justify-content:space-between;flex:1;height:14px;gap:2px}
  .search.recording .wave{display:flex}
  .search.recording input{display:none}
  .wave i{display:block;width:2px;height:4px;border-radius:1px;background:var(--surface-0);
          animation:wave 0.9s linear infinite}
  /* staggered delays for a natural, wave-like cadence */
  .wave i:nth-child(3n+1){animation-delay:0s}
  .wave i:nth-child(3n+2){animation-delay:0.2s}
  .wave i:nth-child(3n+3){animation-delay:0.4s}
  @keyframes wave{0%,100%{height:4px}50%{height:14px}}
  @media (prefers-reduced-motion:reduce){.wave i{animation:none;height:14px}}

  /* labeled tool icons — full-height square cell (width = header height) */
  .tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
        width:var(--header-h);height:var(--header-h);flex:none;box-sizing:border-box;border-left:1px solid var(--line-100);color:var(--ink-700)}
  .tool:hover{background:var(--surface-100)}
  .tool svg{width:20px;height:20px;color:var(--ink-700)}
  .tool span{font:var(--t-micro);font-size:9px;color:var(--ink-600);white-space:nowrap}
  .badge{position:absolute;top:14px;right:18px;width:6px;height:6px;box-sizing:border-box;
         border-radius:50%;background:var(--danger)}

  /* user trigger — full-height square cell (width = header height) */
  .user{display:flex;align-items:center;justify-content:center;gap:var(--space-2);cursor:pointer;
        width:var(--header-h);height:var(--header-h);flex:none;box-sizing:border-box;border-left:1px solid var(--line-100);
        margin-left:-24px}
  .user:hover{background:var(--surface-100)}
  .user.open{background:var(--blue-100)}
  .avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
          background:var(--blue-100);color:var(--blue-600);font-size:14px;font-weight:600;text-transform:uppercase}
  .user .caret{width:18px;height:18px;color:var(--blue-500);transition:transform .18s}

  /* ---- user dropdown ---- */
  .menu{position:absolute;top:74px;right:0;width:264px;background:var(--surface-0);border:1px solid var(--line-100);
        border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;z-index:5}
  .menu-head{background:var(--blue-100);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .menu-head .field .lbl{font:var(--t-small);font-size:12px;color:var(--ink-400);line-height:1.2}
  .menu-head .field .val{font-size:12px;font-weight:500;color:var(--ink-900);line-height:1.3;margin-top:2px}
  .menu-list{padding:0}
  .menu-list .mi{display:flex;align-items:center;gap:5px;padding:10px;min-width:180px;
                 font-size:12px;font-weight:500;color:var(--ink-700);cursor:pointer}
  .menu-list .mi:hover{background:var(--blue-100)}
  .menu-list .mi svg{width:20px;height:20px;flex:none;color:var(--ink-600)}
  .menu-list .mi.danger{color:var(--danger)}
  .menu-list .mi.danger svg{color:var(--danger)}

  /* ---- responsive breakpoints (header adapts to any screen) ---- */
  /* tablet: shrink the smart-search bar */
  @media (max-width:1024px){
    .header{gap:16px;padding-left:20px}
    .search{flex:0 1 200px;width:200px}
  }
  /* small tablet / large phone: hamburger appears, subtext hidden, search collapses to an icon-only cell */
  @media (max-width:820px){
    .hamburger{display:grid}
    .titleblock p{display:none}
    .search{flex:0 0 var(--header-h);width:var(--header-h);min-width:var(--header-h);height:var(--header-h);
            border-radius:0;padding:0;justify-content:center;gap:0}
    .search input,.search .mic,.search .wave{display:none}
    .search>svg{width:20px;height:20px}
    .menu{width:min(264px,calc(100vw - 24px))}
  }
  /* phone: hide optional smart search entirely, keep Title, Reminders, User */
  @media (max-width:560px){
    .header{gap:8px;padding-left:12px}
    .search{display:none}
    .tool span{display:none}
    .tool{width:52px}
    .user{width:52px}
  }
</style></head><body>
<div class="stage">
  <div class="header">
    <!-- Hamburger: toggles the Left Menu on small screens (hidden on desktop). -->
    <button class="hamburger" type="button" title="Menu" aria-label="Toggle navigation">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="titleblock">
      <h1>Header Section</h1>
      <p title="Defines the structure, spacing, branding, and behavior standards for the application header across all platforms.">Defines the structure, spacing, branding, and behavior standards for the application header across all platforms.</p>
    </div>

    <div class="spacer"></div>

    <!-- OPTIONAL: gradient smart search + voice mic. Include only when the screen requests search. -->
    <label class="search">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input placeholder="Type to search or press '/' to begin">
      <span class="wave" aria-hidden="true"></span>
      <button class="mic" id="micBtn" type="button" title="Voice search" aria-pressed="false">
        <svg class="ic-mic" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="ic-stop" fill="currentColor" stroke="none" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
    </label>

    <!-- DEFAULT CTA: Reminders. Add further CTAs by cloning this .tool cell (icon + label, optional .badge). -->
    <div class="tool" title="Reminders">
      <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge"></span>
      <span>Reminders</span>
    </div>

    <!-- DEFAULT: user details cell + dropdown. Always present. -->
    <div class="user" id="userTrigger">
      <div class="avatar" id="hdr-avatar">P</div>
      <svg class="caret" id="caret" style="transform:rotate(180deg)" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>

  <div class="menu" id="userMenu">
    <div class="menu-head">
      <div class="field"><div class="lbl">Name</div><div class="val">prashanth_19</div></div>
      <div class="field"><div class="lbl">Role Name</div><div class="val">Admin</div></div>
    </div>
    <div class="menu-list">
      <div class="mi">
        <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 13l1.2 1.2 2-2.2M8.5 17.2h6"/></svg>
        Settings
      </div>
      <div class="mi">
        <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 13l1.2 1.2 2-2.2M8.5 17.2h6"/></svg>
        Change Password
      </div>
      <div class="mi danger">
        <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 13l1.2 1.2 2-2.2M8.5 17.2h6"/></svg>
        Logout
      </div>
    </div>
  </div>
</div>

<script>
  // toggle dropdown + caret direction
  const trigger = document.getElementById('userTrigger');
  const menu = document.getElementById('userMenu');
  const caret = document.getElementById('caret');
  let open = true;
  function setOpen(v){
    open = v;
    menu.style.display = v ? 'block' : 'none';
    caret.style.transform = v ? 'rotate(180deg)' : 'rotate(0deg)';
    trigger.classList.toggle('open', v);
  }
  trigger.addEventListener('click', (e)=>{ e.stopPropagation(); setOpen(!open); });

  // voice recording toggle
  const micBtn = document.getElementById('micBtn');
  const searchEl = document.querySelector('.search');
  // fill the waveform with enough bars to span the full search width
  const waveEl = searchEl.querySelector('.wave');
  waveEl.innerHTML = Array.from({length:48}, ()=>'<i></i>').join('');
  micBtn.addEventListener('click', (e)=>{
    e.preventDefault(); e.stopPropagation();
    const on = !searchEl.classList.contains('recording');
    searchEl.classList.toggle('recording', on);
    micBtn.classList.toggle('recording', on);
    micBtn.setAttribute('aria-pressed', on);
    micBtn.title = on ? 'Stop' : 'Voice search';
  });
  document.addEventListener('click', (e)=>{ if(!menu.contains(e.target)) setOpen(false); });
  setOpen(false);
</script>
</body></html>
