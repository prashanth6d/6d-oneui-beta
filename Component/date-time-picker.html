<!-- @dsCard group="Components" name="Date & Time Picker" subtitle="Single date + time selectors sharing the Date Range Picker's field, popover & calendar styling; closed by default, opens on field click. Date commits on select; Time commits via Apply/Cancel." viewport="760x520" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .card{padding:28px 24px;display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;max-width:760px}
  .col{display:flex;flex-direction:column;gap:14px}
  .lbl{font-size:12px;font-weight:500;color:var(--field-label);display:block}

  .anchor{position:relative;width:252px}
  /* trigger field — canonical 40px form-field spec */
  .field{height:var(--field-h);border:1px solid var(--field-border);border-radius:var(--field-radius);background:var(--surface-0);padding:0 10px;
         display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
  .field:hover:not(.open){border-color:var(--ink-400);background:var(--surface-50)}
  .field.open{border-color:var(--field-border-focus);background:var(--surface-0);box-shadow:var(--field-focus-ring)}
  .field .val{font-size:12px;font-weight:500;color:var(--ink-400)}
  .field .val.set{color:var(--field-value)}
  .field .ic{width:16px;height:16px;color:var(--ink-600);flex:none}

  /* popover */
  .pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--surface-0);border:1px solid var(--line-100);
       border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:var(--space-3);display:none;
       opacity:0;transform:translateY(-6px);transition:opacity .18s ease,transform .18s ease}
  .pop.open{display:block;opacity:1;transform:translateY(0)}

  /* ---- calendar (matches Date Range Picker month) ---- */
  .cal{width:252px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;height:24px;margin-bottom:12px}
  .cal-month{font-size:14px;font-weight:500;color:var(--ink-900);flex:1;text-align:center}
  .cal-nav{width:24px;height:24px;border:0;background:transparent;border-radius:var(--radius-md);display:grid;place-items:center;cursor:pointer;color:var(--ink-700)}
  .cal-nav:hover{background:var(--surface-100)}
  .cal-nav svg{width:16px;height:16px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:var(--space-1)}
  .grid .wd{font-size:12px;font-weight:400;color:var(--ink-400);height:30px;display:flex;align-items:center;justify-content:center}
  .cell{height:34px;display:flex;align-items:center;justify-content:center;position:relative}
  .d{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
     font-size:13px;font-weight:400;color:var(--ink-900);cursor:pointer;position:relative;z-index:1}
  .d:hover{background:var(--blue-tint-15)}
  .d.muted{visibility:hidden}
  .d.today{box-shadow:inset 0 0 0 1px var(--ink-400)}
  .d.sel{background:var(--blue-500);color:var(--surface-0);font-weight:500}
  .d.sel:hover{background:var(--blue-600)}

  /* ---- time selector ---- */
  .time{width:252px}
  .time-body{display:flex;align-items:flex-start;gap:14px}
  .tcol{flex:1;min-width:0}
  .tcol .h{font-size:12px;font-weight:400;color:var(--ink-400);margin-bottom:var(--space-2);text-align:center;height:30px;display:flex;align-items:center;justify-content:center}
  .tlist{display:flex;flex-direction:column;gap:var(--space-1);max-height:150px;overflow:auto;padding-right:var(--space-1)}
  .tlist::-webkit-scrollbar{width:5px}
  .tlist::-webkit-scrollbar-thumb{background:var(--line-200);border-radius:3px}
  .tlist .o{font-size:13px;color:var(--ink-900);height:20px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);cursor:pointer}
  .tlist .o:hover{background:var(--blue-tint-15)}
  .tlist .o.sel{background:var(--blue-500);color:var(--surface-0);font-weight:500}
  .ampm{display:flex;flex-direction:column;gap:6px;flex:none}
  .ampm button{appearance:none;border:1px solid var(--blue-500);background:var(--surface-0);cursor:pointer;font-family:var(--font-ui);
        font-size:12px;font-weight:500;color:var(--blue-500);padding:8px 12px;border-radius:var(--radius-md)}
  .ampm button.on{background:var(--blue-500);color:var(--surface-0)}

  /* footer with Apply / Cancel (shared) */
  .pop-foot{display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--line-100)}
  .btn{font-size:12px;font-weight:500;line-height:1;border-radius:var(--radius-sm);padding:9px 14px;border:1px solid transparent;cursor:pointer;min-width:80px}
  .btn.primary{background:var(--blue-500);color:var(--surface-0)}
  .btn.primary:hover{background:var(--blue-600)}
  .btn.ghost{background:var(--surface-0);color:var(--ink-900);border-color:var(--line-200)}
  .btn.ghost:hover{background:var(--surface-50)}
  .btn:disabled{background:var(--line-100);color:var(--ink-400);border-color:transparent;cursor:not-allowed;box-shadow:none}
</style></head><body>
<div class="card">

  <!-- DATE PICKER -->
  <div class="col">
    <label class="lbl">Date</label>
    <div class="anchor">
      <div class="field" id="dateField">
        <span class="val" id="dateVal">Select date</span>
        <svg class="ic" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      </div>
      <div class="pop" id="calPop">
        <div class="cal">
          <div class="cal-head">
            <button class="cal-nav" id="prevM"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
            <span class="cal-month" id="calMonth"></span>
            <button class="cal-nav" id="nextM"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
          <div class="grid" id="calGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TIME PICKER -->
  <div class="col">
    <label class="lbl">Time</label>
    <div class="anchor">
      <div class="field" id="timeField">
        <span class="val" id="timeVal">Select time</span>
        <svg class="ic" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
      <div class="pop" id="timePop">
        <div class="time">
          <div class="time-body">
            <div class="tcol"><div class="h">Hour</div><div class="tlist" id="hourList"></div></div>
            <div class="tcol"><div class="h">Minute</div><div class="tlist" id="minList"></div></div>
            <div class="ampm"><div class="h">&nbsp;</div><button id="amBtn" class="on">AM</button><button id="pmBtn">PM</button></div>
          </div>
        </div>
        <div class="pop-foot">
          <button class="btn ghost" id="timeCancel">Cancel</button>
          <button class="btn primary" id="timeApply">Apply</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WD=['S','M','T','W','T','F','S']; // week starts Sunday, single-letter (matches range picker)
  const key=d=>d.getFullYear()*10000+d.getMonth()*100+d.getDate();

  /* ---- popover open/close: closes ONLY via Apply/Cancel (no outside-click dismiss) ---- */
  function stop(e){ e.stopPropagation(); }

  /* ================= DATE PICKER ================= */
  const today=new Date(); today.setHours(0,0,0,0);
  const dateField=document.getElementById('dateField'), calPop=document.getElementById('calPop');
  const calGrid=document.getElementById('calGrid'), calMonth=document.getElementById('calMonth');
  let view=new Date(today.getFullYear(), today.getMonth(), 1);
  let selected=null;            // working selection inside the open popover
  let committedDate=null;       // applied value shown in the field

  function fmtDate(d){ return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+d.getFullYear(); }
  function syncDateField(){
    const v=document.getElementById('dateVal');
    if(committedDate){ v.textContent=fmtDate(committedDate); v.classList.add('set'); }
    else { v.textContent='Select date'; v.classList.remove('set'); }
  }
  function renderCal(){
    calMonth.textContent = MONTHS[view.getMonth()]+' '+view.getFullYear();
    let html = WD.map(w=>'<div class="wd">'+w+'</div>').join('');
    const startDow=new Date(view.getFullYear(), view.getMonth(), 1).getDay();
    const dim=new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
    for(let i=0;i<startDow;i++) html+='<div class="cell"><span class="d muted"></span></div>';
    const sel=selected?key(selected):null;
    for(let day=1;day<=dim;day++){
      const d=new Date(view.getFullYear(), view.getMonth(), day), k=key(d);
      let dCls='d';
      if(k===key(today)) dCls+=' today';
      if(sel && k===sel) dCls+=' sel';
      html+='<div class="cell"><span class="'+dCls+'" data-day="'+day+'">'+day+'</span></div>';
    }
    calGrid.innerHTML=html;
  }
  calGrid.addEventListener('click',(e)=>{
    const c=e.target.closest('[data-day]'); if(!c) return;
    selected=new Date(view.getFullYear(), view.getMonth(), +c.dataset.day);
    committedDate=new Date(selected); syncDateField(); closeDate();
  });
  document.getElementById('prevM').addEventListener('click',()=>{ view.setMonth(view.getMonth()-1); renderCal(); });
  document.getElementById('nextM').addEventListener('click',()=>{ view.setMonth(view.getMonth()+1); renderCal(); });

  function openDate(){
    selected = committedDate ? new Date(committedDate) : null;
    view = new Date((committedDate||today).getFullYear(), (committedDate||today).getMonth(), 1);
    calPop.classList.add('open'); dateField.classList.add('open'); renderCal();
  }
  function closeDate(){ calPop.classList.remove('open'); dateField.classList.remove('open'); }
  dateField.addEventListener('click',(e)=>{ stop(e); calPop.classList.contains('open') ? closeDate() : openDate(); });

  /* ================= TIME PICKER ================= */
  const timeField=document.getElementById('timeField'), timePop=document.getElementById('timePop');
  const hourList=document.getElementById('hourList'), minList=document.getElementById('minList');
  const amBtn=document.getElementById('amBtn'), pmBtn=document.getElementById('pmBtn');
  let tState={h:null, m:null, ap:'AM'};        // working state
  let committedTime=null;                       // applied {h,m,ap}

  for(let h=1;h<=12;h++){ const o=document.createElement('div'); o.className='o'; o.textContent=String(h); o.dataset.h=h; hourList.appendChild(o); }
  for(let m=0;m<60;m++){ const o=document.createElement('div'); o.className='o'; o.textContent=String(m).padStart(2,'0'); o.dataset.m=m; minList.appendChild(o); }

  function fmtTime(t){ return String(t.h).padStart(2,'0')+':'+String(t.m).padStart(2,'0')+' '+t.ap; }
  function syncTimeField(){
    const v=document.getElementById('timeVal');
    if(committedTime){ v.textContent=fmtTime(committedTime); v.classList.add('set'); }
    else { v.textContent='Select time'; v.classList.remove('set'); }
  }
  function paintTime(){
    hourList.querySelectorAll('.o').forEach(x=>x.classList.toggle('sel', +x.dataset.h===tState.h));
    minList.querySelectorAll('.o').forEach(x=>x.classList.toggle('sel', +x.dataset.m===tState.m));
    amBtn.classList.toggle('on', tState.ap==='AM'); pmBtn.classList.toggle('on', tState.ap==='PM');
    document.getElementById('timeApply').disabled = !(tState.h!=null && tState.m!=null);
  }
  hourList.addEventListener('click',(e)=>{ const o=e.target.closest('[data-h]'); if(!o)return; tState.h=+o.dataset.h; paintTime(); });
  minList.addEventListener('click',(e)=>{ const o=e.target.closest('[data-m]'); if(!o)return; tState.m=+o.dataset.m; paintTime(); });
  amBtn.addEventListener('click',()=>{ tState.ap='AM'; paintTime(); });
  pmBtn.addEventListener('click',()=>{ tState.ap='PM'; paintTime(); });

  function openTime(){
    tState = committedTime ? {...committedTime} : {h:null, m:null, ap:'AM'};
    timePop.classList.add('open'); timeField.classList.add('open'); paintTime();
    const selH=hourList.querySelector('.o.sel'); if(selH) selH.scrollTop;
  }
  function closeTime(){ timePop.classList.remove('open'); timeField.classList.remove('open'); }
  timeField.addEventListener('click',(e)=>{ stop(e); timePop.classList.contains('open') ? closeTime() : openTime(); });
  document.getElementById('timeApply').addEventListener('click',()=>{ if(tState.h!=null && tState.m!=null){ committedTime={...tState}; syncTimeField(); closeTime(); } });
  document.getElementById('timeCancel').addEventListener('click',closeTime);

  // keep popover clicks from bubbling to the field toggle
  calPop.addEventListener('click',stop); timePop.addEventListener('click',stop);

  renderCal(); syncDateField(); syncTimeField();
</script>
</body></html>
