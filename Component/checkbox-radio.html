<!-- @dsCard group="Components" name="Checkbox - Radiobutton" subtitle="Checkboxes select any number of options from a set; radio buttons select exactly one" viewport="760x520" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .card{padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px 28px;align-items:start}
  .grp{display:flex;flex-direction:column;gap:var(--space-3)}
  .ttl{font-size:11px;font-weight:600;color:var(--ink-900);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line-100);padding-bottom:6px}

  /* checkbox + radio */
  .ck{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;color:var(--ink-900);cursor:pointer;user-select:none}
  .ck.dis{color:var(--ink-400);cursor:not-allowed}
  .box{width:18px;height:18px;border-radius:var(--radius-sm);border:1.5px solid var(--line-200);flex:none;display:grid;place-items:center;
       transition:background .15s ease,border-color .15s ease}
  .box.on{background:var(--blue-500);border-color:var(--blue-500)}
  .box svg{width:11px;height:11px;transform:scale(0);transition:transform .15s ease}
  .box.on svg{transform:scale(1)}
  .box.dis{background:var(--surface-50)}
  .ck.dis .box.on{background:var(--clear-icon);border-color:var(--clear-icon)}
  .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-200);flex:none;display:grid;place-items:center;transition:border-color .15s ease}
  .dot.on{border-color:var(--blue-500)}
  .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue-500);transform:scale(0);transition:transform .15s ease}
  .dot.on::after{transform:scale(1)}
  .dot.dis{background:var(--surface-50)}
  .box svg{stroke:var(--surface-0)}
</style></head><body>
<div class="card">

  <!-- CHECKBOX -->
  <div class="grp">
    <div class="ttl">Checkbox</div>
    <div class="ck" data-ck><span class="box on"><svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Active (toggle me)</div>
    <div class="ck" data-ck><span class="box"><svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Default</div>
    <div class="ck dis"><span class="box on"><svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Disabled</div>
  </div>

  <!-- RADIO -->
  <div class="grp">
    <div class="ttl">Radio Button</div>
    <div data-radio style="display:flex;flex-direction:column;gap:16px">
      <div class="ck"><span class="dot on"></span>Option A</div>
      <div class="ck"><span class="dot"></span>Option B</div>
      <div class="ck"><span class="dot"></span>Option C</div>
    </div>
    <div class="ck dis"><span class="dot"></span>Disabled</div>
  </div>

</div>

<script>
  // ---- checkbox ----
  document.querySelectorAll('[data-ck]').forEach(c=>c.addEventListener('click',()=>c.querySelector('.box').classList.toggle('on')));
  // ---- radio ----
  document.querySelectorAll('[data-radio]').forEach(g=>g.addEventListener('click',(e)=>{ const row=e.target.closest('.ck'); if(!row)return; g.querySelectorAll('.dot').forEach(d=>d.classList.remove('on')); row.querySelector('.dot').classList.add('on'); }));
</script>
</body></html>
