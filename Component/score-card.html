<!-- @dsCard group="Components" title="Score Card" def="A score card surfaces a single KPI: a label (12px regular), the metric value (18px semibold), and a comparison line (10px regular) carrying a trend arrow and percentage — green/up for positive, red/down for negative — against a reference period. Overall padding is 10px. Cards are responsive and align to the 12-column grid." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-50);color:var(--ink-900)}

  /* ---- 12-column grid stage (20px gutters) ---- */
  .stage{padding:24px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px 20px}
  .cell{grid-column:span 12}                                /* xxs / xs — full width */
  @media (min-width:30rem){ .cell{grid-column:span 6} }     /* xs  — half */
  @media (min-width:64rem){ .cell{grid-column:span 3} }     /* md+ — quarter */

  /* ===================== SCORE CARD ===================== */
  .score{background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-md);
          box-shadow:var(--shadow-sm);padding:10px;display:flex;flex-direction:column;gap:6px}

  .s-label{font-size:12px;font-weight:400;line-height:16px;color:var(--ink-600)}     /* 12px regular */
  .s-value{font-size:18px;font-weight:600;line-height:24px;color:var(--ink-900)}     /* 18px semibold */

  /* comparison line — 10px regular */
  .s-trend{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:400;line-height:14px}
  .s-trend .delta{display:inline-flex;align-items:center;gap:3px}
  .s-trend .delta svg{width:12px;height:12px;stroke-width:1.8}
  .s-trend.up   .delta{color:var(--success)}
  .s-trend.down .delta{color:var(--danger)}
  .s-trend .ref{color:var(--ink-400)}
</style></head><body>
<div class="stage">
  <div class="grid">

    <div class="cell">
      <div class="score">
        <div class="s-label">Total Partners</div>
        <div class="s-value">87</div>
        <div class="s-trend up">
          <span class="delta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>10%</span>
          <span class="ref">Previous Period</span>
        </div>
      </div>
    </div>

    <div class="cell">
      <div class="score">
        <div class="s-label">Active SIMs</div>
        <div class="s-value">4,820</div>
        <div class="s-trend up">
          <span class="delta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>6.4%</span>
          <span class="ref">Previous Period</span>
        </div>
      </div>
    </div>

    <div class="cell">
      <div class="score">
        <div class="s-label">Churn Rate</div>
        <div class="s-value">2.3%</div>
        <div class="s-trend down">
          <span class="delta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10"/><path d="M17 7v10H7"/></svg>1.2%</span>
          <span class="ref">Previous Period</span>
        </div>
      </div>
    </div>

    <div class="cell">
      <div class="score">
        <div class="s-label">Monthly Revenue</div>
        <div class="s-value">₹18.4L</div>
        <div class="s-trend down">
          <span class="delta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10"/><path d="M17 7v10H7"/></svg>3.8%</span>
          <span class="ref">Previous Period</span>
        </div>
      </div>
    </div>

  </div>
</div>
</body></html>
