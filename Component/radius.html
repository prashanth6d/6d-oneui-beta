<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radius" subtitle="2 / 4 / 5 / 10 / 16 / 20 px" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">

<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0)}
  .card{padding:20px 22px;display:flex;gap:18px;align-items:flex-end}
  .sw{text-align:center}
  .bx{width:74px;height:62px;background:var(--blue-100);border:1.5px solid var(--blue-500);border-bottom:0}
  .nm{font-size:11px;font-weight:600;color:var(--ink-900);margin-top:var(--space-2)}
  .v{font-size:10px;color:var(--ink-400)}
</style></head><body>
<div class="card">
  <div class="sw"><div class="bx" style="border-radius:var(--radius-sm) 4px 0 0"></div><div class="nm">SM</div><div class="v">4px · button / input / checkbox</div></div>
  <div class="sw"><div class="bx" style="border-radius:var(--radius-md) 6px 0 0"></div><div class="nm">MD</div><div class="v">6px · card</div></div>
  <div class="sw"><div class="bx" style="border-radius:var(--radius-lg) 10px 0 0"></div><div class="nm">LG</div><div class="v">10px · toaster</div></div>
  <div class="sw"><div class="bx" style="border-radius:var(--radius-xl) 16px 0 0"></div><div class="nm">XL</div><div class="v">16px · AARYA</div></div>
</div></body></html>
