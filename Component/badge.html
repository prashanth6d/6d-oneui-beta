<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badge" subtitle="Numeric status data · default · bold · inverse" viewport="900x620" --><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .wrap{padding:32px 28px;display:flex;flex-direction:column;gap:var(--space-4);max-width:844px}

  /* ---- header ---- */
  .head{display:flex;align-items:baseline;gap:var(--space-3)}
  .head h1{margin:0;font:var(--t-h1);font-weight:600}
  .head span{font:var(--t-body);color:var(--ink-400)}

  /* ---- badge ---- */
  .b{display:inline-flex;align-items:center;justify-content:center;height:20px;min-width:20px;
     padding:0 6px;border-radius:var(--radius-pill);font-family:var(--font-ui);
     font-size:11px;font-weight:600;line-height:1;letter-spacing:.01em;white-space:nowrap;
     font-variant-numeric:tabular-nums}
  .neutral{background:var(--surface-100);color:var(--ink-700)}
  .information{background:var(--primary-50);color:var(--primary-600)}
  .success{background:var(--success-bg);color:var(--success)}
  .warning{background:var(--warning-bg);color:var(--ink-900)}
  .danger{background:var(--danger-bg);color:var(--danger)}
  .informationBold{background:var(--primary-500);color:var(--surface-0)}
  .successBold{background:var(--success);color:var(--surface-0)}
  .warningBold{background:var(--warning);color:var(--ink-900)}
  .dangerBold{background:var(--danger);color:var(--surface-0)}
  .inverse{background:var(--surface-0);color:var(--ink-900)}

  /* ---- hero ---- */
  .hero{background:var(--primary-50);border-radius:var(--radius-xl);
        padding:38px;display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap}
  .hero .b{transform:scale(2);transform-origin:center;box-shadow:var(--shadow-sm)}

  /* ---- appearance matrix ---- */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-3)}
  .ap{border:1px solid var(--line-100);border-radius:var(--radius-lg);
      padding:16px var(--space-3);display:flex;flex-direction:column;align-items:center;gap:14px;
      background:var(--surface-0);transition:box-shadow var(--dur-3,.15s) var(--ease-out,ease)}
  .ap:hover{box-shadow:var(--shadow-md)}
  .ap .nm{font:var(--t-tiny);font-weight:600;color:var(--ink-600);text-transform:uppercase;letter-spacing:.05em}
  .ap .r{display:flex;gap:var(--space-2);align-items:center}

  /* ---- lower tiles ---- */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
  .tile{border:1px solid var(--line-100);border-radius:var(--radius-lg);padding:20px 22px;
        display:flex;flex-direction:column;gap:16px}
  .tile .lab{font:var(--t-tiny);font-weight:600;color:var(--ink-400);text-transform:uppercase;letter-spacing:.05em}
  .tile .strip{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .tile.dark{background:var(--ink-900);border-color:var(--ink-900)}
  .tile.dark .lab{color:var(--surface-100)}

  .host{position:relative;width:36px;height:36px;display:grid;place-items:center}
  .host img{width:22px;height:22px}
  .host .b{position:absolute;top:-7px;right:-9px;border:2px solid var(--surface-0)}
  .host .pdot{position:absolute;top:0;right:2px;width:9px;height:9px;border-radius:50%;
              background:var(--danger);border:2px solid var(--surface-0)}
</style></head><body>
<div class="wrap">

  <div class="head"><h1>Badge</h1><span>Numeric status data</span></div>

  <!-- hero -->
  <div class="hero">
    <span class="b informationBold">12</span>
    <span class="b success">+99</span>
    <span class="b warning">7d</span>
    <span class="b danger">99+</span>
    <span class="b neutral">1.2K</span>
  </div>

  <!-- appearance matrix: soft + bold -->
  <div class="grid">
    <div class="ap"><span class="nm">Neutral</span><div class="r"><span class="b neutral">8</span></div></div>
    <div class="ap"><span class="nm">Information</span><div class="r"><span class="b information">24</span><span class="b informationBold">24</span></div></div>
    <div class="ap"><span class="nm">Success</span><div class="r"><span class="b success">5</span><span class="b successBold">5</span></div></div>
    <div class="ap"><span class="nm">Warning</span><div class="r"><span class="b warning">2</span><span class="b warningBold">2</span></div></div>
    <div class="ap"><span class="nm">Danger</span><div class="r"><span class="b danger">1</span><span class="b dangerBold">1</span></div></div>
  </div>

  <!-- lower tiles -->
  <div class="tiles">
    <div class="tile dark">
      <span class="lab">Inverse</span>
      <div class="strip"><span class="b inverse">8</span><span class="b inverse">+99</span><span class="b inverse">1.2K</span><span class="b inverse">3M</span></div>
    </div>
    <div class="tile">
      <span class="lab">Anchored</span>
      <div class="strip">
        <div class="host"><img src="../icons/bell.svg" alt=""><span class="b dangerBold">5</span></div>
        <div class="host"><img src="../icons/message.svg" alt=""><span class="b informationBold">12</span></div>
        <div class="host"><img src="../icons/cart.svg" alt=""><span class="b dangerBold">99+</span></div>
        <div class="host"><img src="../icons/bell.svg" alt=""><span class="pdot"></span></div>
      </div>
    </div>
  </div>

</div>
</body></html>
