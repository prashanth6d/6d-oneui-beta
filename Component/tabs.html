<!DOCTYPE html>
<!-- @dsCard group="Components" name="Tabs" subtitle="Primary (underline) + secondary (segmented)" viewport="700x180" --><html lang="en"><head><meta charset="utf-8">

<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0)}
  .card{padding:20px 22px}
  .ttl{font-size:10px;color:var(--ink-400);margin-bottom:var(--space-2)}
  /* primary tabs: underline */
  .ptabs{display:flex;gap:24px;border-bottom:1px solid var(--line-100)}
  .pt{font:var(--t-body-med);color:var(--ink-600);padding:8px 2px;border-bottom:2px solid transparent;cursor:pointer}
  .pt.on{font:var(--t-body-bold);color:var(--blue-500);border-bottom-color:var(--blue-500)}
  .pt.dis{color:var(--ink-400)}
  /* secondary tabs: pill segmented */
  .stabs{display:inline-flex;background:var(--surface-50);border:1px solid var(--line-100);border-radius:var(--radius-sm);padding:3px;margin-top:var(--space-4)}
  .st{font:var(--t-body-med);color:var(--ink-600);padding:6px 14px;border-radius:3px;cursor:pointer}
  .st.on{background:var(--surface-0);color:var(--blue-500);box-shadow:var(--shadow-xs)}
  .st.dis{color:var(--ink-400)}
</style></head><body>
<div class="card">
  <div class="ttl">Primary tab</div>
  <div class="ptabs">
    <div class="pt on">Accounts (4)</div>
    <div class="pt">SIMs</div>
    <div class="pt">Plans</div>
    <div class="pt dis">Billing</div>
  </div>
  <div class="ttl" style="margin-top:18px">Secondary tab</div>
  <div class="stabs">
    <div class="st on">Active</div>
    <div class="st">Hover</div>
    <div class="st">Default</div>
    <div class="st dis">Disabled</div>
  </div>
</div></body></html>
