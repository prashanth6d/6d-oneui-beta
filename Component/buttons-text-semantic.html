<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0)}
  .card{padding:20px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px;align-items:start}
  .grp{display:flex;flex-direction:column;gap:10px}
  .ttl{font:var(--t-tiny);color:var(--ink-400);text-transform:uppercase;letter-spacing:.04em}
  .btn{font:var(--t-body-med);font-weight:500;border-radius:var(--radius-sm);padding:9px 10px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);width:fit-content}
  /* success: solid default, tinted hover */
  .success{background:#1F8A3B;color:var(--surface-0)}
  .success.hv{background:var(--success-bg);color:#1F8A3B;box-shadow:var(--shadow-md)}
  /* danger: outline default, tinted hover */
  .danger{background:var(--surface-0);color:var(--danger);border-color:var(--danger)}
  .danger.hv{background:var(--danger-bg);box-shadow:var(--shadow-md)}
  /* text buttons */
  .txt{background:none;border:0;font:var(--t-body-med);font-weight:500;cursor:pointer;padding:2px 0;width:fit-content;text-align:left}
  .txt.under{text-decoration:underline}
  /* dropdown */
  .dd{background:var(--blue-500);color:var(--surface-0);border:0;border-radius:var(--radius-sm);padding:9px 10px;font:var(--t-body-med);font-weight:500;display:inline-flex;align-items:center;gap:12px;justify-content:space-between;cursor:pointer;width:fit-content;min-width:120px}
  .menu{border:1px solid var(--line-100);border-top:0;border-radius:0 0 var(--radius-sm) var(--radius-sm);box-shadow:var(--shadow-sm);overflow:hidden;width:140px;box-sizing:border-box}
  .opt{padding:9px 12px;font:var(--t-body);color:var(--ink-700);display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div class="card">
  <div class="grp">
    <div class="ttl">Success</div>
    <button class="btn success">Success Button</button>
    <button class="btn success hv">Success Button</button>
  </div>
  <div class="grp">
    <div class="ttl">Danger</div>
    <button class="btn danger">Danger Button</button>
    <button class="btn danger hv">Danger Button</button>
  </div>
  <div class="grp">
    <div class="ttl">Text</div>
    <button class="txt" style="color:var(--blue-500)">Primary Text Button</button>
    <button class="txt under" style="color:var(--blue-500)">Primary Text Button</button>
    <button class="txt" style="color:var(--danger)">Danger Text Button</button>
    <button class="txt under" style="color:var(--danger)">Danger Text Button</button>
  </div>
  <div class="grp">
    <div class="ttl">Dropdown</div>
    <button class="dd">Icon Button
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div>
      <button class="dd" style="border-radius:var(--radius-sm) var(--radius-sm) 0 0">Icon Button
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
      <div class="menu">
        <div class="opt">MVNO <svg width="12" height="12" fill="none" stroke="var(--ink-400)" stroke-width="2" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
      </div>
    </div>
  </div>
</div></body></html>
