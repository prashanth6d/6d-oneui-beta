<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Typefaces" subtitle="Poppins — the single system typeface" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .card{padding:22px 24px}
  .big{font-size:54px;font-weight:600;line-height:1;color:var(--ink-900)}
  .name{font-size:13px;color:var(--ink-600);margin-top:12px}
  .name b{color:var(--ink-900);font-weight:600}
  .weights{display:flex;gap:22px;flex-wrap:wrap;margin-top:var(--space-3)}
  .weights span{font-size:18px;color:var(--ink-900)}
  .weights span.fb{color:var(--ink-400)}
  .weights small{display:block;font-size:10px;color:var(--ink-400);font-weight:400;margin-top:2px}
  .weights small.tag{color:var(--alert)}
</style></head><body>
<div class="card">
  <div class="big">Aa Bb Cc 0123</div>
  <div class="name"><b>Poppins</b> — the single typeface for the entire system (self-hosted from fonts/, full 100–900 ramp)</div>
  <div class="weights">
    <span style="font-weight:100">Thin<small>100</small></span>
    <span style="font-weight:200">ExtraLight<small>200</small></span>
    <span style="font-weight:300">Light<small>300</small></span>
    <span style="font-weight:400">Regular<small>400</small></span>
    <span style="font-weight:500">Medium<small>500</small></span>
    <span style="font-weight:600">SemiBold<small>600</small></span>
    <span style="font-weight:700">Bold<small>700</small></span>
    <span style="font-weight:800">ExtraBold<small>800</small></span>
    <span style="font-weight:900">Black<small>900</small></span>
  </div>
</div></body></html>
