<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="6D ONE UI icon set — 729 self-hosted SVGs from icons/" viewport="960x640" --><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .wrap{padding:20px 22px}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:4px}
  .title{font-size:15px;font-weight:600;color:var(--ink-900)}
  .count{font:var(--t-tiny);color:var(--ink-400)}
  .count b{color:var(--ink-700)}
  .note{font:var(--t-tiny);color:var(--ink-400);margin:6px 0 14px}
  .note code{background:var(--surface-1,#f4f4f4);padding:1px 5px;border-radius:var(--radius-sm,4px);color:var(--ink-700)}
  .search{position:relative;margin-bottom:16px;max-width:340px}
  .search input{width:100%;height:36px;border:1px solid var(--border-200,#e2e2e2);border-radius:var(--radius-md,6px);
    padding:0 12px 0 34px;font-family:var(--font-ui);font-size:13px;color:var(--ink-900);background:var(--surface-0);outline:none}
  .search input:focus{border-color:var(--info,#0099FF);box-shadow:0 0 0 3px color-mix(in srgb,var(--info,#0099FF) 14%,transparent)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-400)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
  .ico{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border-radius:var(--radius-md,6px);
    cursor:pointer;border:1px solid transparent;transition:background .12s ease,border-color .12s ease}
  .ico:hover{background:var(--surface-1,#f6f7f9);border-color:var(--border-200,#e6e6e6)}
  .ico img{width:24px;height:24px;display:block;pointer-events:none}
  .ico span{font:var(--t-micro);font-size:10.5px;line-height:1.25;color:var(--ink-400);text-align:center;
    word-break:break-word;max-width:100%}
  .ico:hover span{color:var(--ink-700)}
  .ico.copied{border-color:var(--info,#0099FF)}
  .ico.copied span{color:var(--info,#0099FF)}
  .empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--ink-400);font:var(--t-tiny)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink-900);color:#fff;font-size:12px;padding:8px 14px;border-radius:var(--radius-md,6px);
    transition:opacity .18s ease,transform .18s ease;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<div class="wrap">
  <div class="head">
    <div class="title">Iconography</div>
    <div class="count"><b id="shown">0</b> of <b id="total">0</b> icons</div>
  </div>
  <div class="note">The only sanctioned icon set · self-hosted from <code>icons/</code> · default size 16px (<code>--icon-size</code>) · reference each by its semantic name, e.g. <code>&lt;img src="icons/simSwap.svg"&gt;</code>. Click any icon to copy its name.</div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="Search 729 icons by name…" autocomplete="off">
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(async () => {
  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  const shown = document.getElementById('shown');
  const totalEl = document.getElementById('total');
  const toast = document.getElementById('toast');
  let toastT;
  let names = [];
  try {
    names = await (await fetch('../icons/registry.json')).json();
  } catch (e) {
    grid.innerHTML = '<div class="empty">Could not load icons/registry.json</div>';
    return;
  }
  totalEl.textContent = names.length;
  q.placeholder = 'Search ' + names.length + ' icons by name…';

  const cells = names.map(name => {
    const el = document.createElement('div');
    el.className = 'ico';
    el.dataset.name = name;
    el.dataset.lc = name.toLowerCase();
    el.innerHTML = '<img loading="lazy" src="../icons/' + name + '.svg" alt="' + name + '"><span>' + name + '</span>';
    el.addEventListener('click', () => {
      navigator.clipboard && navigator.clipboard.writeText(name);
      el.classList.add('copied');
      setTimeout(() => el.classList.remove('copied'), 700);
      toast.textContent = 'Copied "' + name + '"';
      toast.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(() => toast.classList.remove('show'), 1200);
    });
    grid.appendChild(el);
    return el;
  });

  function filter() {
    const t = q.value.trim().toLowerCase();
    let n = 0;
    for (const el of cells) {
      const hit = !t || el.dataset.lc.includes(t);
      el.style.display = hit ? '' : 'none';
      if (hit) n++;
    }
    shown.textContent = n;
    let empty = grid.querySelector('.empty');
    if (n === 0 && !empty) {
      empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No icons match "' + q.value + '"';
      grid.appendChild(empty);
    } else if (n > 0 && empty) {
      empty.remove();
    }
  }
  q.addEventListener('input', filter);
  filter();
})();
</script>
</body></html>
