<!-- @dsCard group="Components" name="Profile Overview" subtitle="Canonical entity-overview header — identity + meta + status + Actions menu + KPI strip + dynamic tabs" viewport="1240x760" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-50);color:var(--ink-900)}
  .stage{padding:var(--space-5) 0}

  /* ===================== PROFILE OVERVIEW SHELL ===================== */
  .po{width:100%;background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden}

  /* ---------------- TOP SECTION (AARYA AI surface) ---------------- */
  .po-top{padding:var(--space-4) var(--space-4) 0;background:var(--aarya-gradient-rev);color:var(--surface-0)}
  .po-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
  .po-id{display:flex;align-items:center;gap:var(--space-3);min-width:0}

  /* avatar (Avatar.html spec — circle, xl) */
  .avatar{--sz:var(--avatar-xl);width:var(--sz);height:var(--sz);flex:none;border-radius:50%;overflow:hidden;
          display:grid;place-items:center;font-weight:600;text-transform:uppercase;background:var(--blue-100);color:var(--blue-600)}
  .avatar .inner{width:100%;height:100%;display:grid;place-items:center;font-size:24px;line-height:1}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}

  .po-idtext{min-width:0}
  .po-name{font:var(--t-h1);font-weight:500;color:var(--surface-0);margin:0}
  .po-meta{display:flex;flex-wrap:wrap;align-items:center;row-gap:var(--space-1);margin-top:var(--space-1)}
  .po-meta .mi{display:inline-flex;align-items:center;gap:6px;font:var(--t-small);font-weight:400;font-size:12px;color:var(--surface-0);
               padding:0 5px;border-right:1px solid rgba(255,255,255,.28);white-space:nowrap}
  .po-meta .mi:first-child{padding-left:0}
  .po-meta .mi img{width:14px;height:14px;opacity:.9;filter:brightness(0) invert(1)}
  .po-loz{display:inline-flex;flex-wrap:wrap;gap:var(--space-2);padding-left:5px}

  /* Actions dropdown (single PRIMARY action per hierarchy) */
  .po-actions{flex:none}
  .dd{position:relative;display:inline-block}
  .dd .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
           font-size:12px;font-weight:500;line-height:1;border-radius:var(--radius-pill);padding:5px;
           border:1px solid transparent;background:var(--surface-0);color:var(--ink-900);cursor:pointer;transition:var(--motion-hover)}
  .dd .btn:hover,.dd.open .btn{background:var(--surface-100)}
  .dd .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-200)}
  .dd .btn .chev{width:14px;height:14px;transition:var(--motion-chevron)}
  .dd.open .btn .chev{transform:rotate(180deg)}
  .menu{position:absolute;top:calc(100% + var(--space-1));right:0;min-width:200px;display:none;z-index:var(--z-dropdown);
        background:var(--surface-0);border:1px solid var(--field-list-border);border-radius:var(--radius-md);
        box-shadow:var(--field-list-shadow);overflow:hidden}
  .dd.open .menu{display:block}
  .menu::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--space-1));height:var(--space-1)}
  @media (hover:hover){.dd:hover .menu{display:block}.dd:hover .btn{background:var(--surface-100)}.dd:hover .btn .chev{transform:rotate(180deg)}}
  .menu .it{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:12px;color:var(--ink-900);
            border-top:1px solid var(--line-100);cursor:pointer;white-space:nowrap;transition:var(--motion-row)}
  .menu .it:first-child{border-top:0}
  .menu .it:hover{background:var(--blue-100)}
  .menu .it img{width:16px;height:16px;flex:none;opacity:.75}
  .menu .it.danger{color:var(--danger)}
  .menu .it.danger:hover{background:var(--danger-bg)}

  /* KPI strip (AI surface, continuous with top section) */
  .po-stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--aarya-gradient-rev);padding:var(--space-3) var(--space-4)}
  .po-stat{padding:var(--space-1) var(--space-3);min-width:0}
  .po-stat:nth-child(6n+1){padding-left:0}
  .po-stat .lab{font-size:12px;font-weight:400;line-height:16px;color:var(--ink-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .po-stat .val{font-size:12px;font-weight:400;line-height:16px;color:var(--surface-0);margin-top:2px;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------------- TABS ---------------- */
  .po-tabsbar{padding:var(--space-2) var(--space-4) 0;overflow-x:auto}
  .po-tabs{display:flex;gap:0;min-width:max-content;border-bottom:1px solid var(--line-100)}
  .pt{font:var(--t-small);color:var(--ink-600);background:none;border:0;border-bottom:2px solid transparent;
      padding:8px var(--space-3);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:0;transition:var(--motion-hover)}
  .pt .ct{color:var(--ink-400);font-weight:400;font-size:10px;line-height:14px;margin-left:0}
  .pt:hover:not(.dis):not(.on){color:var(--ink-900);font-weight:500;border-bottom-color:var(--line-200)}
  .pt.on{font:var(--t-body-bold);color:var(--blue-500);border-bottom-color:var(--blue-500)}
  .pt.on .ct{color:var(--blue-500)}
  .pt.dis{color:var(--ink-400);cursor:not-allowed}
  .pt:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-200);border-radius:var(--radius-sm)}

  /* ---------------- PANEL ---------------- */
  .po-panel{padding:var(--space-4)}
  .po-sec-title{font:var(--t-section);color:var(--ink-900);margin:0 0 var(--space-4)}
  .po-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4) var(--grid-gutter)}
  .po-field{min-width:0}
  .po-field .flab{font:var(--t-small);line-height:16px;color:var(--ink-400)}
  .po-field .fval{font-size:12px;font-weight:500;line-height:16px;color:var(--ink-900);margin-top:2px;word-break:break-word}

  .po-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);
            padding:var(--space-5);text-align:center;min-height:180px}
  .po-empty img{width:32px;height:32px;opacity:.4}
  .po-empty .t{font:var(--t-body-med);color:var(--ink-600)}
  .po-empty .s{font:var(--t-small);color:var(--ink-400);max-width:340px}

  /* ===================== LOZENGE (Lozenge.html semantics) ===================== */
  .lz{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--lz-h);padding:0 var(--space-2);
      border-radius:var(--radius-sm);font-family:var(--font-ui);font-size:10px;font-weight:600;line-height:1;
      letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  .lz.neutral{background:var(--surface-100);color:var(--ink-700)}
  .lz.information{background:var(--primary-50);color:var(--primary-600)}
  .lz.success{background:var(--success-bg);color:var(--success)}
  .lz.warning{background:var(--warning-bg);color:var(--ink-900)}
  .lz.alert{background:var(--alert-bg);color:var(--alert)}
  .lz.danger{background:var(--danger-bg);color:var(--danger)}
  .lz.neutralBold{background:var(--ink-600);color:var(--surface-0)}
  .lz.informationBold{background:var(--primary-500);color:var(--surface-0)}
  .lz.successBold{background:var(--success);color:var(--surface-0)}
  .lz.warningBold{background:var(--warning);color:var(--ink-900)}
  .lz.alertBold{background:var(--alert);color:var(--surface-0)}
  .lz.dangerBold{background:var(--danger);color:var(--surface-0)}

  /* ===================== RESPONSIVE (12 → 6 → 2) ===================== */
  /* Tablet: KPI strip 3-up, fields 3-up */
  @media (max-width:1023px){
    .po-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
    .po-stat{border-top:1px solid rgba(255,255,255,.22);padding:var(--space-2) var(--space-3)}
    .po-stat:nth-child(3n+1){padding-left:0}
    .po-stat:nth-child(-n+3){border-top:0}
    .po-fields{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  /* Mobile: identity stacks, Actions full width, KPI 2-up, fields 2-up */
  @media (max-width:767px){
    .po-head{flex-direction:column;align-items:stretch}
    .po-actions{width:100%}
    .po-actions .dd{display:block}
    .dd .btn{width:100%;border-radius:var(--radius-pill)}
    .menu{left:0;right:0}
    .po-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .po-stat{border-top:1px solid rgba(255,255,255,.22);padding:var(--space-2) var(--space-3)}
    .po-stat:nth-child(2n+1){padding-left:0}
    .po-stat:nth-child(-n+2){border-top:0}
    .po-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:479px){
    .po-name{font:var(--t-h2)}
    .po-fields{grid-template-columns:1fr}
    .po-meta .mi{border-right:0;padding:0 5px 0 0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="stage">
  <div class="ds-grid">
    <div class="ds-col-12">
      <section class="po" aria-label="Profile overview">
        <div class="po-top">
          <div class="po-head">
            <div class="po-id">
              <div class="po-idtext">
                <h1 class="po-name" id="poName"></h1>
                <div class="po-meta" id="poMeta"></div>
              </div>
            </div>
            <div class="po-actions">
              <div class="dd" id="poActions">
                <button class="btn" type="button" aria-haspopup="menu" aria-expanded="false">
                  <span class="t">Actions</span>
                  <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="menu" role="menu"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="po-stats" id="poStats"></div>
        <div class="po-tabsbar"><div class="po-tabs" id="poTabs" role="tablist"></div></div>
        <div class="po-panel" id="poPanel" role="tabpanel"></div>
      </section>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   PROFILE OVERVIEW — canonical entity-overview header.
   Reused for EVERY overview page: customer, partner, reseller, user, account.
   Drive the whole component from this one config object. Tabs are DYNAMIC —
   list only the tabs the use case needs; add a matching entry in `panels`
   (a fields definition-grid) or leave it out to show the empty state.
   ============================================================================ */
const PROFILE = {
  name: 'TechCorp Industries',
  avatar: { initials: 'TC' },                 // or { img: 'https://…/logo.png', alt: 'TechCorp' }
  meta: [
    { icon: 'accountDetails', text: 'ID 3020302920' },
    { icon: 'calendar',       text: 'Since 2 years' },
    { icon: 'phone',          text: '+1 (555) 321-0987' },
    { icon: 'email',          text: 'janesmith@example.com' },
    { icon: 'star',           text: 'VIP Client' }
  ],
  statuses: [                                  // Lozenge appearances (semantic only)
    { label: 'Active',  appearance: 'success' },
    { label: 'Healthy', appearance: 'successBold' }
  ],
  actions: [                                   // one PRIMARY "Actions" menu
    { label: 'Edit Profile',    icon: 'edit' },
    { label: 'Generate Report', icon: 'export' },
    { label: 'Add Account',     icon: 'addAccount' },
    { label: 'Deactivate',      icon: 'planDeactivate', danger: true }
  ],
  stats: [                                     // KPI strip (label → value)
    { label: 'Accounts',         value: '12' },
    { label: 'Allocated SIM(s)', value: '5,000' },
    { label: 'BRN Number',       value: '871624871654' },
    { label: 'Outstanding Dues', value: '$20,000' },
    { label: 'Billing Cycle',    value: 'Monthly' },
    { label: 'Documents',        value: '10' }
  ],
  tabs: [                                      // DYNAMIC — vary per use case
    { id: 'overview',  label: 'Overview' },
    { id: 'accounts',  label: 'Accounts',  count: 4 },
    { id: 'sims',      label: 'SIMs',      count: '5,000' },
    { id: 'plans',     label: 'Plans',     count: 3 },
    { id: 'billing',   label: 'Billing' },
    { id: 'users',     label: 'Users',     count: 230 },
    { id: 'branding',  label: 'Branding Templates' },
    { id: 'documents', label: 'Documents', count: 10 },
    { id: 'whitelist', label: 'URL Whitelist', count: 4 },
    { id: 'audit',     label: 'Audit' }
  ],
  panels: {
    overview: {
      title: 'Profile Details',
      fields: [
        { label: 'Country & Timezone', value: 'Singapore (UTC+08:00)', icon: 'location' },
        { label: 'Currency',           value: 'USD', icon: 'currencyExchange' },
        { label: 'Registered On',      value: '12 Mar 2024', icon: 'calendar' },
        { label: 'Account Manager',    value: 'Jane Smith' },
        { label: 'Segment',            value: 'Enterprise' },
        { label: 'Preferred Language', value: 'English' },
        { label: 'Tax / GST ID',       value: 'SG-2024-88123' },
        { label: 'Primary Contact',    value: '+1 (555) 321-0987', icon: 'phone' }
      ]
    }
  }
};

const ICON = n => '../icons/' + n + '.svg';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* name + meta + statuses */
document.getElementById('poName').textContent = PROFILE.name;
document.getElementById('poMeta').innerHTML =
  (PROFILE.meta||[]).map(m =>
    '<span class="mi">'+esc(m.text)+'</span>').join('') +
  ((PROFILE.statuses||[]).length ? '<span class="po-loz">' +
    PROFILE.statuses.map(s => '<span class="lz '+(s.appearance||'neutral')+'">'+esc(s.label)+'</span>').join('') +
    '</span>' : '');

/* actions menu */
(function(){
  const dd = document.getElementById('poActions');
  const btn = dd.querySelector('.btn'); const menu = dd.querySelector('.menu');
  menu.innerHTML = (PROFILE.actions||[]).map(a =>
    '<div class="it'+(a.danger?' danger':'')+'" role="menuitem" tabindex="0">'+
      (a.icon?'<img src="'+ICON(a.icon)+'" alt="">':'')+esc(a.label)+'</div>').join('');
  const close = () => { dd.classList.remove('open'); btn.setAttribute('aria-expanded','false'); };
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const open = dd.classList.toggle('open'); btn.setAttribute('aria-expanded', open?'true':'false');
  });
  menu.addEventListener('click', e => { if (e.target.closest('.it')) close(); });
  document.addEventListener('click', close);
})();

/* KPI strip */
document.getElementById('poStats').innerHTML = (PROFILE.stats||[]).map(s =>
  '<div class="po-stat"><div class="lab" title="'+esc(s.label)+'">'+esc(s.label)+
  '</div><div class="val" title="'+esc(s.value)+'">'+esc(s.value)+'</div></div>').join('');

/* tabs + panel */
(function(){
  const tabsEl = document.getElementById('poTabs');
  const panelEl = document.getElementById('poPanel');
  const tabs = PROFILE.tabs || [];

  function renderPanel(id){
    const p = (PROFILE.panels||{})[id];
    if (p && p.fields){
      panelEl.innerHTML =

        '<div class="po-fields">' + p.fields.map(f =>
          '<div class="po-field"><div class="flab">'+esc(f.label)+
          '</div><div class="fval">'+esc(f.value)+'</div></div>').join('') + '</div>';
    } else if (p && p.html){
      panelEl.innerHTML = p.html;
    } else {
      const lbl = (tabs.find(t=>t.id===id)||{}).label || 'This section';
      panelEl.innerHTML =
        '<div class="po-empty"><img src="'+ICON('documentation')+'" alt="">'+
        '<div class="t">'+esc(lbl)+'</div>'+
        '<div class="s">This tab\u2019s content is provided per use case \u2014 add a matching entry in <b>panels</b> or embed the relevant Component here.</div></div>';
    }
  }

  tabsEl.innerHTML = tabs.map((t,i) =>
    '<button class="pt'+(t.disabled?' dis':'')+(i===0?' on':'')+'" role="tab" data-id="'+esc(t.id)+'"'+
    (t.disabled?' aria-disabled="true"':'')+' aria-selected="'+(i===0?'true':'false')+'">'+
    esc(t.label)+(t.count!=null?'<span class="ct">('+esc(t.count)+')</span>':'')+'</button>').join('');

  tabsEl.addEventListener('click', e => {
    const b = e.target.closest('.pt'); if (!b || b.classList.contains('dis')) return;
    tabsEl.querySelectorAll('.pt').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-selected','false'); });
    b.classList.add('on'); b.setAttribute('aria-selected','true');
    renderPanel(b.dataset.id);
  });

  if (tabs.length) renderPanel(tabs[0].id);
})();
</script>
</body></html>
