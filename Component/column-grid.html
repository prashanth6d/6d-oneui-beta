<!-- @dsCard group="Spacing" name="Grid layouts" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-50);color:var(--ink-900);
       padding:28px 24px 40px}
  .wrap{width:100%}

  .sec-label{font:var(--t-body-bold);color:var(--ink-900);margin:0 0 14px}
  .sec-label + .sec-label{margin-top:0}
  section + section{margin-top:44px}

  /* ---- grid overlay frame ---- */
  .frame{position:relative;border:1px solid var(--line-200);border-radius:var(--radius-lg);
         background:var(--surface-0);overflow:hidden}
  .overlay{position:absolute;inset:0;display:grid;gap:var(--ov-gutter);
           padding-inline:var(--ov-margin);align-content:stretch}
  .overlay .bar{background:var(--blue-100);border-left:1px solid var(--blue-200);
                border-right:1px solid var(--blue-200)}
  .caption{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:8px;text-align:center;pointer-events:none}
  .caption .title{font:var(--t-h1);letter-spacing:-.01em;color:var(--ink-900)}
  .caption .meta{display:flex;gap:6px;align-items:center}
  .caption .chip{font:var(--t-micro);letter-spacing:.02em;color:var(--ink-600);background:var(--surface-0);
                 border:1px solid var(--line-200);border-radius:var(--radius-sm);padding:4px 8px}

  /* device widths for the responsive tiers */
  .desktop{--ov-margin:60px;--ov-gutter:24px;grid-template-columns:repeat(12,1fr)}
  .tablet{--ov-margin:32px;--ov-gutter:16px;grid-template-columns:repeat(6,1fr);max-width:760px}
  .mobile{--ov-margin:16px;--ov-gutter:16px;grid-template-columns:repeat(2,1fr);max-width:380px}
  .desktop .frame{height:300px}
  .tablet .frame{height:220px}
  .mobile .frame{height:220px}
  .tier{margin-bottom:34px}

  /* ---- per-gutter spacing ruler (aligned to the overlay gutters) ---- */
  .gutter-ruler{position:relative;display:grid;gap:var(--ov-gutter);
                padding-inline:var(--ov-margin);margin-top:10px}
  .gutter-ruler.desktop{--glabel:"24px"}
  .gutter-ruler.tablet,.gutter-ruler.mobile{--glabel:"16px"}
  .gutter-ruler .col{position:relative;height:40px}
  .gutter-ruler .col:last-child .gm{display:none}
  .gm{position:absolute;left:100%;top:0;width:var(--ov-gutter);height:16px;
      border-left:1px dashed var(--blue-200);border-right:1px dashed var(--blue-200)}
  .gm::before{content:"";position:absolute;left:0;right:0;top:16px;height:6px;
              border:1px solid var(--blue-500);border-bottom:0}
  .gm::after{content:var(--glabel);position:absolute;left:50%;top:25px;transform:translateX(-50%);
             font:var(--t-tiny);color:var(--blue-600);white-space:nowrap}

  /* ---- container grid layouts ---- */
  .container-demo{border:1.5px solid var(--blue-500);border-radius:var(--radius-md);
                  background:var(--surface-50);padding:24px;display:flex;flex-direction:column;gap:16px}
  .container-demo .row{--ov-margin:0px;--ov-gutter:16px;position:relative;height:150px}
  .container-demo .frame{height:100%;border-style:dashed;border-color:var(--blue-500);background:var(--surface-0)}
  .c12{grid-template-columns:repeat(12,1fr)}
  .c6{grid-template-columns:repeat(6,1fr)}
  .c5{grid-template-columns:repeat(5,1fr)}
  .c3{grid-template-columns:repeat(3,1fr)}
  .c2{grid-template-columns:repeat(2,1fr)}

  @media (max-width:640px){
    .caption .title{font:var(--t-h2)}
  }
</style></head><body>
<div class="wrap">

  <!-- ============ RESPONSIVE GRID LAYOUTS ============ -->
  <section>
    <p class="sec-label">Grid layouts</p>

    <div class="tier desktop">
      <div class="frame">
        <div class="overlay desktop">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="caption" style="position:absolute;inset:0">
          <span class="title">Desktop</span>
          <span class="meta"><span class="chip">12 columns</span><span class="chip">24px gutter</span><span class="chip">60px margin</span></span>
        </div>
      </div>
      <div class="gutter-ruler desktop">
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
      </div>
    </div>

    <div class="tier tablet">
      <div class="frame">
        <div class="overlay tablet">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="caption" style="position:absolute;inset:0">
          <span class="title">Tablet 768–1023px</span>
          <span class="meta"><span class="chip">6 columns</span><span class="chip">16px gutter</span><span class="chip">32px margin</span></span>
        </div>
      </div>
      <div class="gutter-ruler tablet">
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
      </div>
    </div>

    <div class="tier mobile">
      <div class="frame">
        <div class="overlay mobile">
          <div class="bar"></div><div class="bar"></div>
        </div>
        <div class="caption" style="position:absolute;inset:0">
          <span class="title">Mobile 320–767px</span>
          <span class="meta"><span class="chip">2 columns</span><span class="chip">16px gutter</span><span class="chip">16px margin</span></span>
        </div>
      </div>
      <div class="gutter-ruler mobile">
        <div class="col"><i class="gm"></i></div><div class="col"><i class="gm"></i></div>
      </div>
    </div>
  </section>

  <!-- ============ CONTAINER GRID LAYOUTS ============ -->
  <section>
    <p class="sec-label">Container grid layouts</p>
    <div class="container-demo">
      <div class="row">
        <div class="frame"><div class="overlay c12">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div><div class="caption" style="position:absolute;inset:0"><span class="title">12 columns (auto)</span></div></div>
      </div>
      <div class="row">
        <div class="frame"><div class="overlay c6">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div><div class="caption" style="position:absolute;inset:0"><span class="title">6 columns (auto)</span></div></div>
      </div>
      <div class="row">
        <div class="frame"><div class="overlay c5">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div><div class="caption" style="position:absolute;inset:0"><span class="title">5 columns (auto)</span></div></div>
      </div>
      <div class="row">
        <div class="frame"><div class="overlay c3">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div><div class="caption" style="position:absolute;inset:0"><span class="title">3 columns (auto)</span></div></div>
      </div>
      <div class="row">
        <div class="frame"><div class="overlay c2">
          <div class="bar"></div><div class="bar"></div>
        </div><div class="caption" style="position:absolute;inset:0"><span class="title">2 columns (auto)</span></div></div>
      </div>
    </div>
  </section>

</div>
</body></html>
