<!-- @dsCard group="Components" title="Range" def="A range lets users choose an approximate value on a slider." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{
    --rng-fill:var(--ink-900);          /* filled track + thumb (ink-900) */
    --rng-track:var(--line-200);         /* unfilled track (line-200) */
    --rng-track-h:6px;
    --rng-thumb:20px;
    --rng-dot:6px;
  }
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .card{padding:32px 24px;display:flex;flex-direction:column;gap:34px;max-width:720px}
  .grp{display:flex;flex-direction:column;gap:14px}
  .ttl{font-size:11px;font-weight:600;color:var(--ink-900);text-transform:uppercase;letter-spacing:.05em;
       border-bottom:1px solid var(--line-100);padding-bottom:6px}
  .row{display:flex;align-items:center;gap:18px}
  .caption{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--ink-600)}
  .readout{font-size:12px;font-weight:600;color:var(--ink-900);min-width:38px;text-align:right;flex:none}

  /* ---- range core ---- */
  .range{position:relative;flex:1;height:var(--rng-thumb);display:flex;align-items:center;touch-action:none;cursor:pointer}
  .range .track{position:relative;width:100%;height:var(--rng-track-h);border-radius:var(--radius-pill);background:var(--rng-track)}
  .range .fill{position:absolute;top:0;left:0;height:100%;border-radius:var(--radius-pill);background:var(--rng-fill)}
  /* small end dot at the far right of the track */
  .range .enddot{position:absolute;top:50%;right:0;width:var(--rng-dot);height:var(--rng-dot);margin-top:calc(var(--rng-dot)/-2);
                 margin-right:calc(var(--rng-dot)/-2);border-radius:50%;background:var(--rng-fill)}
  .range .thumb{position:absolute;top:50%;width:var(--rng-thumb);height:var(--rng-thumb);border-radius:50%;
                background:var(--rng-fill);transform:translate(-50%,-50%);transition:box-shadow .15s ease;cursor:grab}
  .range .thumb:hover{box-shadow:0 0 0 6px rgba(29,29,29,.08)}
  .range .thumb.drag{cursor:grabbing;box-shadow:0 0 0 8px rgba(29,29,29,.12)}
  .range:focus-within .thumb{box-shadow:0 0 0 6px rgba(29,29,29,.12)}

  /* value bubble */
  .range .bubble{position:absolute;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--ink-900);color:var(--surface-0);
                 font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--radius-sm);white-space:nowrap;
                 opacity:0;transition:opacity .15s ease;pointer-events:none}
  .range .bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
                        border:4px solid transparent;border-top-color:var(--ink-900)}
  .range.show-bubble .thumb:hover ~ .bubble,
  .range.show-bubble.dragging .bubble{opacity:1}

  /* blue accent variant */
  .range.accent{--rng-fill:var(--blue-500)}
  .range.accent .thumb:hover{box-shadow:0 0 0 6px rgba(0,153,255,.12)}
  .range.accent .thumb.drag{box-shadow:0 0 0 8px rgba(0,153,255,.18)}

  /* disabled */
  .range.dis{pointer-events:none;--rng-fill:#BFBFBF;--rng-track:var(--line-100)}
  .range.dis .thumb{box-shadow:none}

  /* ticks */
  .ticks{display:flex;justify-content:space-between;margin-top:2px;font-size:11px;color:var(--ink-400)}
</style></head><body>
<div class="card">

  <!-- WITH VALUE READOUT -->
  <div class="grp">
    <div class="ttl">With value</div>
    <div class="row">
      <div class="range" data-range data-min="0" data-max="100" data-val="35">
        <div class="track"><div class="fill"></div><span class="enddot"></span></div>
        <div class="thumb" tabindex="0"></div>
      </div>
      <span class="readout" data-readout></span>
    </div>
  </div>

  <!-- VALUE BUBBLE ON HOVER / DRAG -->
  <div class="grp">
    <div class="ttl">Value bubble</div>
    <div class="row">
      <div class="range show-bubble" data-range data-min="0" data-max="100" data-val="72" data-suffix="%">
        <div class="track"><div class="fill"></div><span class="enddot"></span></div>
        <div class="thumb" tabindex="0"></div>
        <div class="bubble" data-bubble></div>
      </div>
    </div>
  </div>

</div>

<script>
  document.querySelectorAll('[data-range]').forEach(r=>{
    const min=+r.dataset.min||0, max=+r.dataset.max||100, step=+r.dataset.step||1, suffix=r.dataset.suffix||'';
    const track=r.querySelector('.track'), fill=r.querySelector('.fill'), thumb=r.querySelector('.thumb');
    const readout=r.parentElement.querySelector('[data-readout]'), bubble=r.querySelector('[data-bubble]');
    let val=+r.dataset.val||min;

    function clampStep(v){ v=Math.round((v-min)/step)*step+min; return Math.max(min,Math.min(max,v)); }
    function fmt(v){ return (Number.isInteger(step)? v : v.toFixed(1))+suffix; }
    function paint(){
      const pct=(val-min)/(max-min)*100;
      fill.style.width=pct+'%';
      thumb.style.left=pct+'%';
      if(readout) readout.textContent=fmt(val);
      if(bubble){ bubble.textContent=fmt(val); bubble.style.left=pct+'%'; }
      r.setAttribute('aria-valuenow', val);
    }
    function setFromX(clientX){
      const rect=track.getBoundingClientRect();
      let pct=(clientX-rect.left)/rect.width; pct=Math.max(0,Math.min(1,pct));
      val=clampStep(min+pct*(max-min)); paint();
    }

    let dragging=false;
    r.addEventListener('pointerdown',(e)=>{
      dragging=true; thumb.classList.add('drag'); r.classList.add('dragging');
      thumb.setPointerCapture?.(e.pointerId);
      setFromX(e.clientX); e.preventDefault();
    });
    r.addEventListener('pointermove',(e)=>{ if(dragging) setFromX(e.clientX); });
    function end(){ dragging=false; thumb.classList.remove('drag'); r.classList.remove('dragging'); }
    r.addEventListener('pointerup', end);
    r.addEventListener('pointercancel', end);

    // keyboard
    thumb.addEventListener('keydown',(e)=>{
      if(e.key==='ArrowRight'||e.key==='ArrowUp'){ val=clampStep(val+step); paint(); e.preventDefault(); }
      else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ val=clampStep(val-step); paint(); e.preventDefault(); }
      else if(e.key==='Home'){ val=min; paint(); e.preventDefault(); }
      else if(e.key==='End'){ val=max; paint(); e.preventDefault(); }
    });

    r.setAttribute('role','slider'); r.setAttribute('aria-valuemin',min); r.setAttribute('aria-valuemax',max);
    paint();
  });
</script>
</body></html>
