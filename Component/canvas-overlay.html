<!-- @dsCard group="WIP" title="Canvas Overlay" def="A full-device overlay whose body is an infinite, pannable dot-grid canvas for building rules, flowcharts, and free-form diagrams." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font-ui);background:#2e2e2e;color:var(--ink-900)}

  /* ============================================================================
     CANVAS OVERLAY — fills the device, 10px inset all sides, 10px radius.
     The whole body is the canvas viewport: a var(--surface-50) surface with a #BBBBBB
     1px dot grid at 10px spacing. Pan by dragging, zoom with the wheel.
     ============================================================================ */
  .canvas-overlay{
    position:fixed;inset:10px;border-radius:var(--radius-lg);overflow:hidden;
    background:var(--surface-50);            /* var(--surface-50) */
    box-shadow:var(--shadow-lg);
    /* 1px dot grid, 10px spacing, #BBBBBB */
    background-image:radial-gradient(var(--dot,var(--line-100)) 1px, transparent 1.4px);
    background-size:10px 10px;
    background-position:0 0;
    touch-action:none;cursor:grab;user-select:none;
  }
  .canvas-overlay.panning{cursor:grabbing}

  /* ---- the transformed "world": nodes + connectors live here ---- */
  .world{position:absolute;top:0;left:0;width:4000px;height:3000px;transform-origin:0 0}
  .world svg.links{position:absolute;top:0;left:0;width:4000px;height:3000px;overflow:visible;pointer-events:none}
  .world svg.links path{fill:none;stroke:var(--line-200);stroke-width:1.5}

  /* ---- nodes — built from the design system card/button vocabulary ---- */
  .node{position:absolute;background:var(--surface-0);border:1px solid var(--line-200);
        border-radius:var(--radius-md);box-shadow:var(--shadow-sm);cursor:grab;
        min-width:148px;max-width:220px}
  .node.dragging{cursor:grabbing;box-shadow:var(--shadow-lg);border-color:var(--ink-400)}
  .node .n-head{display:flex;align-items:center;gap:var(--space-2);padding:8px 12px;border-bottom:1px solid var(--line-100)}
  .node .n-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--blue-500)}
  .node .n-title{font:var(--t-label);color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .n-body{padding:10px 12px;font:var(--t-body);color:var(--ink-600)}

  /* node accents */
  .node.start{border-color:var(--blue-200)}
  .node.start .n-dot{background:var(--blue-500)}
  .node.approve .n-dot{background:var(--success)}
  .node.reject  .n-dot{background:var(--danger)}
  .node.rule .n-dot{background:var(--purple-500)}

  /* decision = rotated square (diamond), label kept upright */
  .node.decision{min-width:0;width:128px;height:128px;border-radius:var(--radius-md);
                 display:grid;place-items:center;transform:rotate(45deg);padding:0;background:var(--surface-0)}
  .node.decision .n-inner{transform:rotate(-45deg);font:var(--t-label);color:var(--ink-900);text-align:center;padding:var(--space-2)}

  /* rule card — IF / THEN expression */
  .node.rule{max-width:248px}
  .node.rule .expr{font:var(--t-small);line-height:18px;color:var(--ink-700)}
  .node.rule .kw{font-weight:700;color:var(--purple-600)}
  .node.rule .tok{background:var(--surface-100);border:1px solid var(--line-100);border-radius:var(--radius-sm);padding:0 4px}

  /* ============================================================================
     PAGE HEADER — pinned to the overlay (never pans away).
     The Back button's LABEL is the dynamic page heading. An info icon sits 10px
     to its right; hovering it reveals the page sub-text as a tooltip.
     ============================================================================ */
  .page-head{position:absolute;top:16px;left:16px;z-index:20;display:flex;align-items:center;gap:10px}
  .back-btn{display:inline-flex;align-items:center;gap:var(--space-2);height:34px;padding:0 16px 0 10px;
            background:var(--surface-0);color:var(--ink-900);border:1px solid var(--line-200);
            border-radius:var(--radius-sm);font:var(--t-section);cursor:pointer;box-shadow:var(--shadow-xs);max-width:440px}
  .back-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back-btn:hover{border-color:var(--ink-400);box-shadow:var(--shadow-md)}
  .back-btn svg{flex:none}

  /* info icon — 10px gap from the Back button */
  .info-btn{width:18px;height:18px;flex:none;display:grid;place-items:center;padding:0;border:none;
            background:transparent;color:var(--ink-400);cursor:help}
  .info-btn:hover,.info-btn:focus-visible{color:var(--ink-700);outline:none}
  .info-btn svg{width:18px;height:18px}

  /* ---- Tooltip (design-system spec) ---- */
  .tooltip{position:fixed;z-index:9999;max-width:240px;background:var(--ink-900);color:var(--surface-0);
           font-size:11px;line-height:15px;font-weight:500;padding:6px 10px;border-radius:var(--radius-sm);
           pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity .14s ease,transform .14s ease;
           text-wrap:pretty}
  .tooltip.show{opacity:1;transform:translateY(0)}
  .tooltip::after{content:"";position:absolute;width:8px;height:8px;background:var(--ink-900);transform:rotate(45deg)}
  .tooltip.pos-bottom::after{top:-3px;left:var(--ax,50%);margin-left:-4px}
  .tooltip.pos-top::after{bottom:-3px;left:var(--ax,50%);margin-left:-4px}

  /* ---- floating zoom toolbar (bottom-center) ---- */
  .zoombar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;
           display:flex;align-items:center;gap:2px;background:var(--surface-0);
           border:1px solid var(--line-200);border-radius:var(--radius-sm);
           box-shadow:var(--shadow-xs);padding:3px}
  .zoombar button{width:28px;height:28px;display:grid;place-items:center;border:none;background:transparent;
                  border-radius:var(--radius-sm);cursor:pointer;color:var(--ink-700)}
  .zoombar button:hover{background:var(--surface-50)}
  .zoombar .pct{min-width:52px;text-align:center;font:var(--t-body-med);color:var(--ink-900);user-select:none}
  .zoombar .sep{width:1px;height:18px;background:var(--line-100);margin:0 2px}

  /* ---- hint chip (bottom-left) ---- */
  .hint{position:absolute;left:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:var(--space-2);
        background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--radius-pill);
        padding:6px 12px;font:var(--t-tiny);color:var(--ink-600);box-shadow:var(--shadow-xs)}
  .hint b{color:var(--ink-900);font-weight:600}
  .hint .d{width:3px;height:3px;border-radius:50%;background:var(--line-200)}
  #arrow path{fill:var(--line-200)}
</style></head><body>

<div class="canvas-overlay" id="overlay" data-screen-label="Canvas Overlay">
  <!-- the pannable / zoomable world -->
  <div class="world" id="world">
    <svg class="links" id="links"></svg>
    <!-- nodes are generated by script into #world -->
  </div>

  <!-- sticky chrome (pinned to overlay): Back(=page heading) + info icon -->
  <div class="page-head">
    <button class="back-btn" id="backBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="lbl" id="pageHeading">Workflow Canvas</span>
    </button>
    <button class="info-btn" id="infoBtn" type="button" aria-label="About this page" data-pos="bottom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <div class="zoombar">
    <button id="zoomOut" type="button" title="Zoom out" aria-label="Zoom out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <div class="pct" id="pct">100%</div>
    <button id="zoomIn" type="button" title="Zoom in" aria-label="Zoom in">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="sep"></div>
    <button id="zoomReset" type="button" title="Reset view" aria-label="Reset view">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.3 2.6L3 8"/><path d="M3 4v4h4"/></svg>
    </button>
  </div>

  <div class="hint">
    <span><b>Drag</b> to pan</span><span class="d"></span>
    <span><b>Scroll</b> to zoom</span><span class="d"></span>
    <span><b>Double-click</b> to add a node</span>
  </div>
</div>

<div class="tooltip" id="tooltip" role="tooltip"></div>

<script>
(function(){
  const overlay = document.getElementById('overlay');
  const world   = document.getElementById('world');
  const links   = document.getElementById('links');
  const pctEl   = document.getElementById('pct');

  // ---- view state -----------------------------------------------------------
  let scale = 1, tx = 0, ty = 0;
  const MIN = 0.3, MAX = 2.5, GRID = 10;

  function apply(){
    world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    overlay.style.backgroundPosition = `${tx}px ${ty}px`;
    overlay.style.backgroundSize = `${GRID*scale}px ${GRID*scale}px`;
    pctEl.textContent = Math.round(scale*100) + '%';
  }
  const snap = v => Math.round(v / GRID) * GRID;

  // ---- nodes ----------------------------------------------------------------
  // seed: a small rule + a flowchart, to show what the canvas holds
  let nid = 0;
  const nodes = [
    {id:++nid, x:60,  y:90,  cls:'rule', title:'Rule · Eligibility',
      html:'<div class="expr"><span class="kw">IF</span> <span class="tok">balance</span> &gt; 0 <span class="kw">AND</span> <span class="tok">kyc</span> = verified<br><span class="kw">THEN</span> proceed to review</div>'},
    {id:++nid, x:430, y:40,  cls:'start', title:'Start', html:'New request received'},
    {id:++nid, x:430, y:200, cls:'',      title:'Validate request', html:'Check fields & documents'},
    {id:++nid, x:466, y:380, cls:'decision', title:'', html:'<div class="n-inner">Eligible?</div>'},
    {id:++nid, x:280, y:600, cls:'approve', title:'Approve', html:'Activate the account'},
    {id:++nid, x:610, y:600, cls:'reject',  title:'Reject',  html:'Notify the requester'}
  ];
  // connectors: [fromId, toId, fromSide, toSide]
  const edges = [
    [2,3,'bottom','top'],
    [3,4,'bottom','top'],
    [4,5,'bottom','top'],
    [4,6,'bottom','top']
  ];

  const elById = {};
  function makeNode(n){
    const el = document.createElement('div');
    el.className = 'node ' + n.cls;
    el.dataset.id = n.id;
    if(n.cls === 'decision'){
      el.innerHTML = n.html;
    } else {
      el.innerHTML =
        (n.title ? `<div class="n-head"><span class="n-dot"></span><span class="n-title">${n.title}</span></div>` : '') +
        `<div class="n-body">${n.html}</div>`;
    }
    el.style.left = n.x + 'px';
    el.style.top  = n.y + 'px';
    world.appendChild(el);
    elById[n.id] = el;
    return el;
  }
  nodes.forEach(makeNode);

  // ---- connector geometry ---------------------------------------------------
  function anchor(n, side){
    const el = elById[n.id];
    let w = el.offsetWidth, h = el.offsetHeight, x = n.x, y = n.y;
    // diamond is rotated 45deg around its own centre — bbox stays the same here
    const cx = x + w/2, cy = y + h/2;
    switch(side){
      case 'top':    return [cx, y];
      case 'bottom': return [cx, y + h];
      case 'left':   return [x, cy];
      case 'right':  return [x + w, cy];
    }
    return [cx, cy];
  }
  function nodeById(id){ return nodes.find(n => n.id === id); }

  function drawLinks(){
    let paths = '';
    for(const [a,b,sa,sb] of edges){
      const na = nodeById(a), nb = nodeById(b);
      if(!na || !nb) continue;
      const [x1,y1] = anchor(na, sa);
      const [x2,y2] = anchor(nb, sb);
      const my = (y1 + y2) / 2;                       // vertical elbow
      const d = `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
      paths += `<path d="${d}" marker-end="url(#arrow)"></path>`;
    }
    links.innerHTML =
      `<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
         <path d="M0,0 L6,3 L0,6 Z"></path></marker></defs>` + paths;
  }
  drawLinks();

  // ---- pointer handling: pan vs node-drag -----------------------------------
  let mode = null;                 // 'pan' | 'node'
  let start = {x:0,y:0,tx:0,ty:0};
  let dragNode = null, grab = {dx:0,dy:0};

  function toWorld(clientX, clientY){
    const r = overlay.getBoundingClientRect();
    return [ (clientX - r.left - tx)/scale, (clientY - r.top - ty)/scale ];
  }

  overlay.addEventListener('pointerdown', e=>{
    const nodeEl = e.target.closest('.node');
    if(nodeEl){
      mode = 'node';
      dragNode = nodeById(+nodeEl.dataset.id);
      const [wx,wy] = toWorld(e.clientX, e.clientY);
      grab.dx = wx - dragNode.x; grab.dy = wy - dragNode.y;
      nodeEl.classList.add('dragging');
    } else {
      mode = 'pan';
      overlay.classList.add('panning');
      start = {x:e.clientX, y:e.clientY, tx, ty};
    }
    overlay.setPointerCapture(e.pointerId);
  });

  overlay.addEventListener('pointermove', e=>{
    if(mode === 'pan'){
      tx = start.tx + (e.clientX - start.x);
      ty = start.ty + (e.clientY - start.y);
      apply();
    } else if(mode === 'node' && dragNode){
      const [wx,wy] = toWorld(e.clientX, e.clientY);
      dragNode.x = snap(wx - grab.dx);
      dragNode.y = snap(wy - grab.dy);
      const el = elById[dragNode.id];
      el.style.left = dragNode.x + 'px';
      el.style.top  = dragNode.y + 'px';
      drawLinks();
    }
  });

  function endDrag(e){
    if(mode === 'node' && dragNode) elById[dragNode.id].classList.remove('dragging');
    overlay.classList.remove('panning');
    mode = null; dragNode = null;
  }
  overlay.addEventListener('pointerup', endDrag);
  overlay.addEventListener('pointercancel', endDrag);

  // ---- wheel zoom (around cursor) -------------------------------------------
  overlay.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = overlay.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const next = Math.min(MAX, Math.max(MIN, scale * (1 - e.deltaY * 0.0015)));
    tx = cx - (cx - tx) * (next/scale);
    ty = cy - (cy - ty) * (next/scale);
    scale = next; apply();
  }, {passive:false});

  // ---- double-click to add a node -------------------------------------------
  let added = 0;
  overlay.addEventListener('dblclick', e=>{
    if(e.target.closest('.node')) return;
    const [wx,wy] = toWorld(e.clientX, e.clientY);
    added++;
    const n = {id:++nid, x:snap(wx-74), y:snap(wy-26), cls:'', title:'New step ' + added, html:'Describe this step'};
    nodes.push(n); makeNode(n); drawLinks();
  });

  // ---- zoom toolbar ---------------------------------------------------------
  function zoomTo(next){
    const r = overlay.getBoundingClientRect();
    const cx = r.width/2, cy = r.height/2;
    next = Math.min(MAX, Math.max(MIN, next));
    tx = cx - (cx - tx) * (next/scale);
    ty = cy - (cy - ty) * (next/scale);
    scale = next; apply();
  }
  document.getElementById('zoomIn').onclick  = ()=> zoomTo(scale + 0.1);
  document.getElementById('zoomOut').onclick = ()=> zoomTo(scale - 0.1);
  document.getElementById('zoomReset').onclick = ()=>{ scale = 1; centre(); };

  // ---- centre the seeded content on load ------------------------------------
  function centre(){
    const r = overlay.getBoundingClientRect();
    // content roughly spans x:60..830, y:40..660 -> centre on ~(445,350)
    tx = r.width/2  - 445 * scale;
    ty = r.height/2 - 360 * scale;
    apply();
  }
  document.getElementById('backBtn').onclick = ()=>{ /* host wires navigation */ };

  // ---- dynamic page heading + info-icon tooltip --------------------------
  // The Back button label IS the page heading; the info icon's tooltip shows
  // the page sub-text. Host sets these per screen.
  const pageHeading = 'Workflow Canvas';
  const pageSubText = 'Untitled diagram · auto-saved';
  document.getElementById('pageHeading').textContent = pageHeading;

  const infoBtn = document.getElementById('infoBtn');
  const tt = document.getElementById('tooltip');
  const SHOW_DELAY = 250, HIDE_DELAY = 150;
  let showT = null, hideT = null;
  function placeTip(){
    const r = infoBtn.getBoundingClientRect(), gap = 8;
    tt.style.left = '-9999px'; tt.style.top = '0';
    requestAnimationFrame(()=>{
      const w = tt.offsetWidth, h = tt.offsetHeight;
      let x = r.left + r.width/2 - w/2, y = r.bottom + gap;
      x = Math.max(4, Math.min(x, innerWidth - w - 4));
      tt.style.left = x + 'px'; tt.style.top = y + 'px';
      tt.style.setProperty('--ax', (r.left + r.width/2 - x) + 'px');
      tt.classList.add('show');
    });
  }
  function showTip(){ tt.textContent = pageSubText; tt.className = 'tooltip pos-bottom'; placeTip(); }
  function onInfoEnter(){ clearTimeout(hideT); clearTimeout(showT); showT = setTimeout(showTip, SHOW_DELAY); }
  function onInfoLeave(){ clearTimeout(showT); hideT = setTimeout(()=> tt.classList.remove('show'), HIDE_DELAY); }
  infoBtn.addEventListener('mouseenter', onInfoEnter);
  infoBtn.addEventListener('mouseleave', onInfoLeave);
  infoBtn.addEventListener('focus', onInfoEnter);
  infoBtn.addEventListener('blur', onInfoLeave);

  centre();
})();
</script>
</body></html>
