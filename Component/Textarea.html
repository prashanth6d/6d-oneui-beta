<!-- @dsCard group="Components" name="Textarea" subtitle="Multi-line text input — default, filled, and disabled states" viewport="760x220" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .card{padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px 28px;align-items:start}
  .grp{display:flex;flex-direction:column;gap:var(--space-3)}
  .ttl{font-size:11px;font-weight:600;color:var(--ink-900);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line-100);padding-bottom:6px}
  .lbl{font-size:12px;font-weight:500;color:var(--ink-600);margin-bottom:6px;display:block}

  .ta-wrap{position:relative}
  .ta{width:100%;min-height:60px;border:1px solid var(--line-200);border-radius:var(--radius-sm);background:var(--surface-0);padding:8px 10px;
      font:inherit;font-size:12px;font-weight:500;color:var(--ink-900);resize:vertical;transition:border-color .15s ease,box-shadow .15s ease}
  .ta::placeholder{color:var(--ink-400)}
  .ta:hover:not(:focus){background:var(--surface-50)}
  .ta:focus{outline:0;border-color:var(--ink-600);background:var(--surface-0);box-shadow:0 0 0 3px rgba(109,109,109,.08)}
  .ta.err{border-color:var(--danger)}
  .ta.err:focus{box-shadow:0 0 0 3px rgba(218,30,40,.1)}
  .ta.dis{background:var(--surface-50);border-color:var(--line-100);color:var(--ink-400);resize:none;cursor:not-allowed}
  .err-msg{font-size:11px;color:var(--danger);margin-top:var(--space-1)}
</style></head><body>
<div class="card">

  <div class="grp">
    <div class="ttl">Textarea</div>
    <div><label class="lbl">Default</label><div class="ta-wrap"><textarea class="ta" placeholder="Placeholder"></textarea></div></div>
  </div>

  <div class="grp">
    <div class="ttl">&nbsp;</div>
    <div><label class="lbl">Filled</label><div class="ta-wrap"><textarea class="ta">Notes captured against this account for follow-up.</textarea></div></div>
  </div>

  <div class="grp">
    <div class="ttl">&nbsp;</div>
    <div><label class="lbl">Disabled</label><div class="ta-wrap"><textarea class="ta dis" disabled>Read-only content</textarea></div></div>
  </div>

</div>
</body></html>
