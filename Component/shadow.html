<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation / shadow" subtitle="Four subtle levels" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">

<link href="../colors_and_type.css" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-50)}
  .card{padding:24px 22px;display:flex;gap:22px;align-items:center}
  .sw{text-align:center}
  .bx{width:96px;height:60px;background:var(--surface-0);border-radius:5px;margin:0 auto}
  .nm{font-size:11px;font-weight:600;color:var(--ink-900);margin-top:12px}
  .v{font-size:10px;color:var(--ink-400)}
</style></head><body>
<div class="card">
  <div class="sw"><div class="bx" style="box-shadow:var(--shadow-xs)"></div><div class="nm">XS</div><div class="v">header / bars</div></div>
  <div class="sw"><div class="bx" style="box-shadow:var(--shadow-sm)"></div><div class="nm">SM</div><div class="v">card / toast</div></div>
  <div class="sw"><div class="bx" style="box-shadow:var(--shadow-md)"></div><div class="nm">MD</div><div class="v">button hover</div></div>
  <div class="sw"><div class="bx" style="box-shadow:var(--shadow-lg)"></div><div class="nm">LG</div><div class="v">popover / overlay</div></div>
</div></body></html>
