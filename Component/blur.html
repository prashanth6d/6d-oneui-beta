<!DOCTYPE html>
<!-- @dsCard group="WIP" name="Backdrop blur" subtitle="Frosted-glass elevation — sm·md·lg·xl, light & dark" viewport="820x520" --><html lang="en"><head><meta charset="utf-8">

<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui)}

  /* textured backdrop so the blur is visible through the glass panels */
  .stage{
    position:relative;min-height:520px;padding:var(--space-5);overflow:hidden;
    background:
      radial-gradient(circle at 18% 22%, rgba(0,153,255,0.55) 0 60px, transparent 61px),
      radial-gradient(circle at 74% 14%, rgba(238,116,59,0.50) 0 90px, transparent 91px),
      radial-gradient(circle at 40% 78%, rgba(15,121,49,0.45) 0 110px, transparent 111px),
      radial-gradient(circle at 88% 70%, rgba(92,0,107,0.45) 0 80px, transparent 81px),
      repeating-linear-gradient(45deg, var(--surface-100) 0 22px, var(--surface-50) 22px 44px);
  }

  .grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
  .panel{
    height:104px;border-radius:var(--radius-lg);
    display:flex;align-items:center;justify-content:center;
    font:var(--t-section);
    -webkit-backdrop-filter:blur(var(--bl));backdrop-filter:blur(var(--bl));
  }
  .light{background:var(--glass-light);color:var(--ink-900)}
  .dark{background:var(--glass-dark);color:#fff}

  /* fallback when backdrop-filter is unsupported: raise overlay opacity */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .light{background:rgba(255,255,255,0.92)}
    .dark{background:rgba(29,29,29,0.90)}
  }
</style></head><body>
<div class="stage">
  <div class="grid">
    <div class="panel light" style="--bl:var(--blur-sm)">sm light</div>
    <div class="panel dark"  style="--bl:var(--blur-sm)">sm dark</div>
    <div class="panel light" style="--bl:var(--blur-md)">md light</div>
    <div class="panel dark"  style="--bl:var(--blur-md)">md dark</div>
    <div class="panel light" style="--bl:var(--blur-lg)">lg light</div>
    <div class="panel dark"  style="--bl:var(--blur-lg)">lg dark</div>
    <div class="panel light" style="--bl:var(--blur-xl)">xl light</div>
    <div class="panel dark"  style="--bl:var(--blur-xl)">xl dark</div>
  </div>
</div>
</body></html>
