<!-- @dsCard group="Components" name="Button Dropdowns" subtitle="A split button lets people perform an action or choose from a small group of similar actions." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
  .card{padding:24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-items:start}
  .col{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
  .ttl{font:var(--t-tiny);color:var(--ink-400);text-transform:uppercase;letter-spacing:.04em}

  .dd{position:relative;display:inline-block}

  /* trigger button — 12px */
  .btn{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:500;
       border-radius:var(--radius-sm);padding:9px 12px;border:1px solid var(--line-200);background:var(--surface-0);color:var(--ink-900);cursor:pointer;min-width:150px}
  .btn svg{width:15px;height:15px;flex:none}
  .btn .ct{color:var(--ink-400);font-weight:400}
  .chev{transition:transform .18s}
  .dd.open .chev{transform:rotate(180deg)}
  .green{background:#EAF8EF;border-color:#9FD8B4;color:var(--success)}
  .red{background:var(--danger-bg);border-color:#F0B6BA;color:var(--danger)}
  .blue{background:var(--info-bg);border-color:#ACD7E8;color:#2E84A8}

  /* dropdown menu — auto width, flush (0px gap) */
  .menu{position:absolute;top:100%;left:0;margin:0;min-width:100%;width:max-content;display:none;z-index:10;
        background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-sm);box-shadow:var(--field-list-shadow);overflow:hidden}
  .dd.open .menu{display:block}
  .menu .it{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:12px;color:var(--ink-900);
            border-top:1px solid var(--line-100);cursor:pointer;white-space:nowrap}
  .menu .it:first-child{border-top:0}
  .menu .it:hover{background:var(--blue-100)}
  .menu .it.danger{color:var(--danger)}
  .menu .it .ct{color:var(--ink-400)}

  /* access pill — 12px trigger */
  .pill{display:inline-flex;align-items:center;justify-content:space-between;gap:var(--space-2);font-size:12px;font-weight:500;
        border-radius:var(--radius-sm);padding:6px 9px;border:1px solid;min-width:140px;cursor:pointer}
  .pill svg{width:13px;height:13px;flex:none}
  .pa{background:#EAF8EF;border-color:var(--success);color:var(--success)}
  .pm{background:var(--warning-bg);border-color:#E0BE1A;color:#8A7400}
  .pc{background:var(--alert-bg);border-color:var(--alert);color:#B66800}
  .pv{background:var(--info-bg);border-color:#42A6CE;color:#2E84A8}
  .pn{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
</style></head><body>
<div class="card">

  <!-- ACTION MENU -->
  <div class="col">
    <div class="ttl">Action menu</div>
    <div class="dd">
      <button class="btn trigger"><span class="t">Quick Actions</span><svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu">
        <div class="it" data-pick>Generate Report</div>
        <div class="it" data-pick>Order New SIMs</div>
        <div class="it" data-pick>Export SIM Data</div>
      </div>
    </div>
  </div>

  <!-- STATUS DROPDOWN -->
  <div class="col">
    <div class="ttl">Status dropdown</div>
    <div class="dd">
      <button class="btn green trigger"><span class="t">Active</span><svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu">
        <div class="it" data-pick>Suspend</div>
        <div class="it" data-pick>Deactivate</div>
        <div class="it" data-pick>In Test</div>
        <div class="it danger" data-pick>Request Termination</div>
      </div>
    </div>
    <div class="dd">
      <button class="btn red trigger"><span class="t">Pending</span><svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu">
        <div class="it" data-pick>Review</div>
        <div class="it" data-pick>Approve</div>
        <div class="it danger" data-pick>Reject</div>
      </div>
    </div>
    <div class="dd">
      <button class="btn blue trigger"><span class="t">In Progress</span><svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu">
        <div class="it" data-pick>Pause</div>
        <div class="it" data-pick>Mark Complete</div>
      </div>
    </div>
  </div>

  <!-- WITH COUNTS + ACCESS LEVEL -->
  <div class="col">
    <div class="ttl">With counts</div>
    <div class="dd">
      <button class="btn trigger"><span class="t">Active <span class="ct">(395)</span></span><svg class="chev" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu">
        <div class="it" data-pick>Suspend <span class="ct">(45)</span></div>
        <div class="it" data-pick>Deactivated <span class="ct">(32)</span></div>
        <div class="it danger" data-pick>Terminated <span class="ct" style="color:#E89AA0">(28)</span></div>
      </div>
    </div>

    <div class="ttl" style="margin-top:4px">Access level</div>
    <div class="dd access"><button class="pill pa trigger"><span class="t">Full Access</span><svg class="chev" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
    <div class="dd access"><button class="pill pm trigger"><span class="t">View &amp; Modify</span><svg class="chev" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
    <div class="dd access"><button class="pill pv trigger"><span class="t">View Only</span><svg class="chev" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
  </div>

</div>

<script>
  const ACCESS=[['pa','Full Access'],['pm','View & Modify'],['pc','View & Create'],['pv','View Only'],['pn','No Access']];
  // build access menus
  document.querySelectorAll('.dd.access').forEach(dd=>{
    const menu=document.createElement('div'); menu.className='menu';
    menu.innerHTML=ACCESS.map(([c,l])=>'<div class="it" data-cls="'+c+'">'+l+'</div>').join('');
    dd.appendChild(menu);
  });

  function closeAll(except){ document.querySelectorAll('.dd.open').forEach(d=>{ if(d!==except) d.classList.remove('open'); }); }

  document.querySelectorAll('.dd').forEach(dd=>{
    const trigger=dd.querySelector('.trigger');
    trigger.addEventListener('click',(e)=>{ e.stopPropagation(); const open=dd.classList.contains('open'); closeAll(dd); dd.classList.toggle('open', !open); });
    dd.querySelector('.menu').addEventListener('click',(e)=>{
      const it=e.target.closest('.it'); if(!it) return;
      if(it.dataset.cls){
        // access level: swap color + label
        const pill=dd.querySelector('.pill');
        pill.className='pill '+it.dataset.cls+' trigger';
        pill.querySelector('.t').textContent=it.textContent.trim();
      } else if(it.hasAttribute('data-pick')){
        trigger.querySelector('.t').innerHTML=it.innerHTML;
      }
      dd.classList.remove('open');
    });
  });
  document.addEventListener('click',()=>closeAll(null));
</script>
</body></html>
