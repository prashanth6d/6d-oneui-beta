<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="styles.css" rel="stylesheet">
<link href="colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1280px;height:854px;overflow:hidden}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-ui)}
  .main{flex:1;background:var(--primary-500);display:grid;place-items:center}
  .main img{width:62%;max-width:640px;height:auto;display:block}
  .strip{width:120px;display:flex;flex-direction:column}
  .strip span{flex:1;display:block}
</style></head><body>
  <div class="tile">
    <div class="main"><img src="assets/6d-logo-white.png" alt="6D Technologies"></div>
    <div class="strip">
      <span style="background:var(--warning)"></span>
      <span style="background:var(--orange-500)"></span>
      <span style="background:var(--purple-500)"></span>
      <span style="background:var(--success)"></span>
    </div>
  </div>
</body></html>
