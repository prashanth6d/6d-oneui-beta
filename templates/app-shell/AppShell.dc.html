<x-dc>
<!-- @template name="App Shell" description="Compliant application frame — canonical Left Menu + Header on a clean 12-col content grid. Start every screen here." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:var(--surface-50);color:var(--ink-900)}
.app{display:flex;align-items:stretch;height:100vh;overflow:hidden}
/* ===== LEFT MENU (canonical) ===== */
.rail{width:210px;flex:none;height:100vh;background:var(--surface-0);border-right:1px solid var(--line-100);display:flex;flex-direction:column;overflow:hidden;transition:width .22s ease}
.rail .brand{flex:none;height:var(--header-h);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line-100);background:#F1F8FF}
.rail .brand .logo-full{height:34px;width:auto;display:block}
.rail .brand .logo-mark{height:34px;width:auto;display:none}
.rail .msearch{display:flex;align-items:center;height:40px;padding:0 10px;color:var(--ink-400)}
.rail .msearch:focus-within{background:var(--blue-100)}
.rail .msearch .s-ic{width:18px;height:18px;flex:none;display:none;color:var(--ink-400)}
.rail .msearch input{border:0;outline:0;flex:1;font-size:12px;font-family:var(--font-ui);color:var(--ink-700);background:transparent}
.rail .msearch input::placeholder{color:var(--ink-400)}
.rail .msearch .clear{display:none;width:20px;height:20px;flex:none;border:0;background:transparent;padding:0;cursor:pointer;color:var(--ink-400);place-items:center}
.rail .msearch .clear svg{width:14px;height:14px}
.rail .msearch.filled .clear{display:inline-grid}
.rail .msearch.filled .kbd{display:none}
.rail .msearch .kbd{flex:none;font-size:12px;font-weight:500;color:var(--ink-400);background:var(--surface-100);border-radius:var(--radius-sm);padding:1px 11px;line-height:1.4}
.nav{flex:1;overflow:auto;display:flex;flex-direction:column}
.nav::-webkit-scrollbar{width:0}
.group{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:var(--space-2);height:40px;padding:0 10px;font-size:11px;font-weight:400;color:#3D3D3D;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--surface-50)}
.item:hover{background:var(--blue-100)}
.item .ic{width:20px;height:20px;flex:none;color:#5A5A5A}
.item .grow{flex:1;overflow:hidden;text-overflow:ellipsis}
.item .chev{width:16px;height:16px;flex:none;color:var(--ink-400);transition:transform .18s}
.item.active,.group.open>.item{background:linear-gradient(90deg,#DCEFFF 0%,rgba(220,239,255,0) 100%);color:#2E9BE6}
.item.active{font-weight:600}
.item.active .ic,.group.open>.item .ic{color:#2E9BE6}
.item.active .chev,.group.open>.item .chev{color:#2E9BE6}
.group.open>.item .chev{transform:rotate(180deg)}
.sub{display:none;flex-direction:column;background:var(--surface-50)}
.group.open>.sub{display:flex}
.sitem{display:flex;align-items:center;height:40px;padding:0 10px 0 40px;font-size:11px;font-weight:400;color:var(--ink-600);cursor:pointer}
.sitem:hover{background:var(--blue-100)}
.sitem.active{color:#E8730C;font-weight:600}
/* no-result state */
.empty{display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:64px 20px;text-align:center}
.empty.show{display:flex}
.empty .txt{font-size:15px;font-weight:400;color:var(--danger)}
.empty svg{overflow:visible}
.empty .nr-cloud{transform-box:fill-box;transform-origin:center;animation:nrFloat 3s ease-in-out infinite}
.empty .nr-search{transform-box:fill-box;transform-origin:60px 44px;animation:nrScan 2.4s ease-in-out infinite}
.nr-cloud{fill:var(--line-200)}
.nr-lens{fill:var(--surface-0)}
@keyframes nrFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes nrScan{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(-4px,2px) rotate(-7deg)}65%{transform:translate(4px,-1px) rotate(6deg)}}
.foot{flex:none;border-top:1px solid var(--line-100);height:64px;padding:0 16px;display:flex;align-items:center;gap:10px}
.foot .fl{display:flex;align-items:center;flex:1;font-size:10px;font-weight:400;color:#3D3D3D;white-space:nowrap;overflow:hidden}
.foot .fl .grow{overflow:hidden;text-overflow:ellipsis}
.collapse{flex:none;width:32px;height:32px;border:1px solid var(--line-200);border-radius:var(--radius-md);background:var(--surface-0);display:grid;place-items:center;color:var(--ink-600);cursor:pointer;transition:background .15s}
.collapse:hover{background:var(--surface-100)}
.collapse svg{width:17px;height:17px}
.rail.collapsed{width:72px}
.rail.collapsed .brand{padding:0}
.rail.collapsed .brand .logo-full{display:none}
.rail.collapsed .brand .logo-mark{display:block}
.rail.collapsed .msearch{justify-content:center;padding:0}
.rail.collapsed .msearch .s-ic{display:block}
.rail.collapsed .msearch input,.rail.collapsed .msearch .kbd,.rail.collapsed .msearch .clear{display:none}
.rail.collapsed .empty{display:none!important}
.rail.collapsed .nav{align-items:center}
.rail.collapsed .item{width:40px;padding:0;justify-content:center;gap:0;margin:0 auto;border-radius:8px}
.rail.collapsed .item .grow,.rail.collapsed .item .chev{display:none}
.rail.collapsed .group.open>.item{background:none;color:#3D3D3D}
.rail.collapsed .group.open>.item .ic{color:#5A5A5A}
.rail.collapsed .item.active{background:var(--blue-100)}
.rail.collapsed .item.active .ic{color:#2E9BE6}
.rail.collapsed .sub{display:none!important}
.rail.collapsed .foot{justify-content:center;padding:0}
.rail.collapsed .foot .fl{display:none}
.rail .expandbtn{display:none}
.rail.collapsed .collapsebtn{display:none}
.rail.collapsed .expandbtn{display:grid}
/* collapsed Level 2 hover flyout */
.flyout{position:fixed;z-index:var(--z-popover,1200);min-width:196px;max-width:260px;background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:6px 0;display:none;opacity:0;transform:translateX(-6px);transition:opacity .16s ease,transform .16s ease}
.flyout.show{display:block;opacity:1;transform:translateX(0)}
.flyout .fly-head{font-size:12px;font-weight:600;color:var(--ink-900);padding:6px 14px 8px;border-bottom:1px solid var(--line-100);margin-bottom:4px}
.flyout .fly-item{display:flex;align-items:center;height:36px;padding:0 14px;font-size:12px;font-weight:400;color:var(--ink-600);cursor:pointer;white-space:nowrap}
.flyout .fly-item:hover{background:var(--blue-100)}
.flyout .fly-item.active{color:#E8730C;font-weight:600}
/* ===== MAIN COLUMN ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
/* ===== HEADER (canonical) ===== */
.header{width:100%;height:var(--header-h);flex:none;box-sizing:border-box;background:var(--blue-100);border-bottom:1px solid var(--line-100);box-shadow:var(--shadow-xs);display:flex;align-items:center;gap:24px;padding:0 0 0 28px;position:relative}
.hamburger{display:none;flex:none;width:40px;height:40px;margin-right:-8px;border:0;background:transparent;border-radius:var(--radius-md);cursor:pointer;place-items:center;color:var(--ink-700)}
.hamburger:hover{background:var(--surface-100)}
.hamburger svg{width:22px;height:22px}
.titleblock{flex:0 1 auto;max-width:520px;min-width:0}
.titleblock h1{margin:0;font:var(--t-page-title);color:var(--ink-900);letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titleblock p{margin:2px 0 0;font:var(--t-small);font-size:12px;color:var(--ink-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 auto;min-width:16px}
.search{flex:0 1 280px;width:280px;min-width:150px;display:flex;align-items:center;gap:12px;height:40px;border-radius:var(--radius-pill);padding:0 3px 0 10px;background:linear-gradient(90deg,var(--purple-600) 0%,var(--blue-500) 100%);box-shadow:var(--shadow-sm)}
.search>svg{width:18px;height:18px;flex:none;color:var(--surface-0);opacity:.95}
.search.recording>svg{display:none}
.search input{border:0;outline:0;flex:1;font:var(--t-body);font-size:13px;font-family:var(--font-ui);color:var(--surface-0);background:transparent}
.search input::placeholder{color:rgba(255,255,255,.82)}
.mic{flex:none;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.22);display:grid;place-items:center;color:var(--surface-0);transition:background .15s}
.mic:hover{background:rgba(255,255,255,.34)}
.mic svg{width:17px;height:17px}
.mic.recording{background:var(--surface-0)}
.mic.recording:hover{background:var(--surface-0)}
.mic .ic-stop{display:none}
.mic.recording .ic-mic{display:none}
.mic.recording .ic-stop{display:block;color:var(--purple-600)}
.wave{display:none;align-items:center;justify-content:space-between;flex:1;height:14px;gap:2px}
.search.recording .wave{display:flex}
.search.recording input{display:none}
.wave i{display:block;width:2px;height:4px;border-radius:1px;background:var(--surface-0);animation:wave 0.9s linear infinite}
.wave i:nth-child(3n+1){animation-delay:0s}
.wave i:nth-child(3n+2){animation-delay:0.2s}
.wave i:nth-child(3n+3){animation-delay:0.4s}
@keyframes wave{0%,100%{height:4px}50%{height:14px}}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;width:var(--header-h);height:var(--header-h);flex:none;box-sizing:border-box;border-left:1px solid var(--line-100);color:var(--ink-700)}
.tool:hover{background:var(--surface-100)}
.tool svg{width:20px;height:20px;color:var(--ink-700)}
.tool span{font:var(--t-micro);font-size:9px;color:var(--ink-600);white-space:nowrap}
.tool .badge{position:absolute;top:14px;right:18px;width:6px;height:6px;box-sizing:border-box;border-radius:50%;background:var(--danger)}
.user{display:flex;align-items:center;justify-content:center;gap:var(--space-2);cursor:pointer;width:var(--header-h);height:var(--header-h);flex:none;box-sizing:border-box;border-left:1px solid var(--line-100);margin-left:-24px}
.user:hover{background:var(--surface-100)}
.user.open{background:var(--blue-100)}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--blue-100);color:var(--blue-600);font-size:14px;font-weight:600;text-transform:uppercase}
.user .caret{width:18px;height:18px;color:var(--blue-500);transition:transform .18s}
.menu{position:absolute;top:74px;right:0;width:264px;background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;z-index:var(--z-dropdown,5);display:none}
.menu-head{background:var(--blue-100);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.menu-head .lbl{font:var(--t-small);font-size:12px;color:var(--ink-400);line-height:1.2}
.menu-head .val{font-size:12px;font-weight:500;color:var(--ink-900);line-height:1.3;margin-top:2px}
.menu-list .mi{display:flex;align-items:center;gap:5px;padding:10px;font-size:12px;font-weight:500;color:var(--ink-700);cursor:pointer}
.menu-list .mi:hover{background:var(--blue-100)}
.menu-list .mi svg{width:20px;height:20px;flex:none;color:var(--ink-600)}
.menu-list .mi.danger{color:var(--danger)}
.menu-list .mi.danger svg{color:var(--danger)}
/* ===== BODY / CONTENT ===== */
.body{flex:1;overflow:auto;padding:30px}
.ds-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--grid-gutter,24px)}
@media (max-width:1024px){.header{gap:16px;padding-left:20px}.search{flex:0 1 200px;width:200px}}
@media (max-width:820px){.rail{position:fixed;left:0;top:0;z-index:var(--z-drawer,1300);transform:translateX(-100%);transition:transform .22s ease}.rail.open{transform:translateX(0)}.hamburger{display:grid}.titleblock p{display:none}.search{flex:0 0 var(--header-h);width:var(--header-h);min-width:var(--header-h);height:var(--header-h);border-radius:0;padding:0;justify-content:center;gap:0}.search input,.search .mic,.search .wave{display:none}.search>svg{width:20px;height:20px}.menu{width:min(264px,calc(100vw - 24px))}.body{padding:24px 32px}}
@media (max-width:560px){.header{gap:8px;padding-left:12px}.search{display:none}.tool span{display:none}.tool{width:52px}.user{width:52px}.body{padding:16px}}
@media (prefers-reduced-motion:reduce){.rail,.rail .item .chev,.user .caret,.flyout,.wave i,.empty .nr-cloud,.empty .nr-search{transition:none;animation:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;showSearch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Header&quot;}}">
class Component extends DCLogic {
  componentWillUnmount() {
    if (this._onKeydown) document.removeEventListener('keydown', this._onKeydown);
  }
  componentDidMount() {
    const root = document.getElementById('appShell');
    if (!root) return;
    const rail = root.querySelector('#rail');
    const nav = root.querySelector('.nav');

    // ---- collapse / expand / hamburger ----
    root.querySelector('#collapseBtn').addEventListener('click', () => rail.classList.add('collapsed'));
    root.querySelector('#expandBtn').addEventListener('click', () => { rail.classList.remove('collapsed'); closeFlyout(); });
    root.querySelector('#hamburger').addEventListener('click', (e) => { e.stopPropagation(); rail.classList.toggle('open'); });

    // ---- Level 2 accordion (collapsed by default) ----
    root.querySelectorAll('.group[data-acc] > .item').forEach(it => {
      it.addEventListener('click', () => {
        if (rail.classList.contains('collapsed')) { rail.classList.remove('collapsed'); return; }
        it.parentElement.classList.toggle('open');
      });
    });
    // ---- Level 1 selection ----
    root.querySelectorAll('.group:not([data-acc]) > .item').forEach(it => {
      it.addEventListener('click', () => {
        if (rail.classList.contains('collapsed')) { rail.classList.remove('collapsed'); return; }
        root.querySelectorAll('.item.active').forEach(x => x.classList.remove('active'));
        it.classList.add('active');
      });
    });
    // ---- Submenu selection ----
    nav.querySelectorAll('.sitem').forEach(s => {
      s.addEventListener('click', (e) => {
        e.stopPropagation();
        nav.querySelectorAll('.sitem.active').forEach(x => x.classList.remove('active'));
        s.classList.add('active');
      });
    });

    // ---- menu search: filter + no-result state ----
    const searchEl = root.querySelector('#menuSearch');
    const searchInput = root.querySelector('#menuSearchInput');
    const clearBtn = root.querySelector('#menuClearBtn');
    const empty = root.querySelector('#menuEmpty');
    const groups = [...nav.querySelectorAll('.group')];
    let savedOpen = null;
    const applyFilter = (raw) => {
      const q = raw.trim().toLowerCase();
      if (!q) {
        groups.forEach((g, i) => {
          g.style.display = '';
          g.querySelectorAll('.sitem').forEach(s => s.style.display = '');
          if (savedOpen) g.classList.toggle('open', savedOpen[i]);
        });
        savedOpen = null;
        empty.classList.remove('show');
        return;
      }
      if (savedOpen === null) savedOpen = groups.map(g => g.classList.contains('open'));
      let anyVisible = false;
      groups.forEach(g => {
        const item = g.querySelector(':scope > .item');
        const label = item.querySelector('.grow').textContent.toLowerCase();
        const subs = [...g.querySelectorAll('.sitem')];
        const parentMatch = label.includes(q);
        let childMatch = false;
        subs.forEach(s => {
          const m = s.textContent.toLowerCase().includes(q);
          s.style.display = (m || parentMatch) ? '' : 'none';
          if (m) childMatch = true;
        });
        const vis = parentMatch || childMatch;
        g.style.display = vis ? '' : 'none';
        g.classList.toggle('open', vis && childMatch);
        if (vis) anyVisible = true;
      });
      empty.classList.toggle('show', !anyVisible);
    };
    searchInput.addEventListener('input', () => {
      searchEl.classList.toggle('filled', searchInput.value.length > 0);
      applyFilter(searchInput.value);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchEl.classList.remove('filled');
      applyFilter('');
      searchInput.focus();
    });

    // ---- "/" keyboard shortcut — focus the menu search from anywhere ----
    const isTypingTarget = (el) => {
      if (!el) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    };
    this._onKeydown = (e) => {
      if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && !isTypingTarget(e.target)) {
        e.preventDefault();
        if (rail.classList.contains('collapsed')) { rail.classList.remove('collapsed'); closeFlyout(); }
        searchInput.focus();
        searchInput.select();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        if (searchInput.value) {
          searchInput.value = '';
          searchEl.classList.remove('filled');
          applyFilter('');
        } else {
          searchInput.blur();
        }
      }
    };
    document.addEventListener('keydown', this._onKeydown);

    // ---- collapsed Level 2 hover flyout ----
    const flyout = root.querySelector('#flyout');
    const flyHead = root.querySelector('#flyHead');
    const flyList = root.querySelector('#flyList');
    let flyTimer = null;
    function openFlyout(group) {
      clearTimeout(flyTimer);
      const item = group.querySelector(':scope > .item');
      flyHead.textContent = item.querySelector('.grow').textContent;
      flyList.innerHTML = '';
      group.querySelectorAll('.sitem').forEach(s => {
        const el = document.createElement('div');
        el.className = 'fly-item' + (s.classList.contains('active') ? ' active' : '');
        el.setAttribute('role', 'menuitem');
        el.textContent = s.textContent;
        el.addEventListener('click', () => {
          nav.querySelectorAll('.sitem.active').forEach(x => x.classList.remove('active'));
          s.classList.add('active');
          closeFlyout();
        });
        flyList.appendChild(el);
      });
      const r = item.getBoundingClientRect();
      flyout.style.left = (r.right + 8) + 'px';
      flyout.style.top = r.top + 'px';
      flyout.classList.add('show');
      const fb = flyout.getBoundingClientRect();
      if (fb.bottom > innerHeight - 8) flyout.style.top = Math.max(8, innerHeight - 8 - fb.height) + 'px';
    }
    function closeFlyout() { flyout.classList.remove('show'); }
    const scheduleClose = () => { flyTimer = setTimeout(closeFlyout, 140); };
    root.querySelectorAll('.group[data-acc]').forEach(g => {
      g.addEventListener('mouseenter', () => { if (rail.classList.contains('collapsed')) openFlyout(g); });
      g.addEventListener('mouseleave', () => { if (rail.classList.contains('collapsed')) scheduleClose(); });
    });
    flyout.addEventListener('mouseenter', () => clearTimeout(flyTimer));
    flyout.addEventListener('mouseleave', scheduleClose);

    // ---- header voice/waveform ----
    const hdrSearch = root.querySelector('#hdrSearch');
    const micBtn = root.querySelector('#micBtn');
    const waveEl = hdrSearch.querySelector('.wave');
    waveEl.innerHTML = Array.from({ length: 48 }, () => '<i></i>').join('');
    micBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      const on = !hdrSearch.classList.contains('recording');
      hdrSearch.classList.toggle('recording', on);
      micBtn.classList.toggle('recording', on);
      micBtn.setAttribute('aria-pressed', on);
      micBtn.title = on ? 'Stop' : 'Voice search';
    });

    // ---- user dropdown ----
    const trigger = root.querySelector('#userTrigger');
    const menu = root.querySelector('#userMenu');
    const caret = root.querySelector('#caret');
    let open = false;
    const setOpen = (v) => {
      open = v;
      menu.style.display = v ? 'block' : 'none';
      caret.style.transform = v ? 'rotate(180deg)' : 'rotate(0deg)';
      trigger.classList.toggle('open', v);
    };
    trigger.addEventListener('click', (e) => { e.stopPropagation(); setOpen(!open); });
    document.addEventListener('click', (e) => { if (!menu.contains(e.target)) setOpen(false); });
    setOpen(false);

    // ---- optional smart search ----
    if (this.props.showSearch === false) hdrSearch.style.display = 'none';
  }
}
</script>
</body>
</html>
