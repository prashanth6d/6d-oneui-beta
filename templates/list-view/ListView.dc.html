<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="List View" description="Canonical Table/List view \u2014 the full Data Table component (search-all-columns, status/more filters, chips, sortable columns, Sort by Risk, Add Column, Nested View, Bulk Actions, per-view, full pagination + go-to-page, row kebab actions, truncation tooltips). Use for every Table/List screen." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
a{color:var(--blue-500);text-decoration:none}
a:hover{color:var(--blue-600)}
.panel{border-top:1px solid var(--line-100);border-bottom:1px solid var(--line-100);overflow:hidden;background:transparent}
.toolbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-100);flex-wrap:wrap}
.listing{font-size:14px;font-weight:500;color:var(--ink-900);white-space:nowrap}
.listing b{color:var(--blue-500)}
.dt-search{display:flex;align-items:center;gap:var(--space-2);height:var(--field-h);border:1px solid var(--field-border);border-radius:var(--radius-sm);padding:0 10px;min-width:240px;color:var(--ink-400)}
.dt-search svg{width:14px;height:14px;flex:none}
.dt-search input{border:0;outline:0;font-size:12px;font-family:var(--font-ui);color:var(--ink-900);background:transparent;width:100%}
.dt-search input::placeholder{color:var(--ink-400)}
.dt-spacer{flex:1}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:7px;height:var(--field-h);padding:0 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;border:1px solid var(--line-200);background:var(--surface-0);color:var(--ink-900)}
.tbtn:hover{border-color:var(--ink-400)}
.tbtn svg{width:15px;height:15px;color:var(--ink-600)}
.tbtn .cnt{color:var(--ink-400);font-weight:400}
.tbtn.active{border-color:var(--blue-500);color:var(--blue-500)}
.tbtn.active svg{color:var(--blue-500)}
.tbtn.primary{background:var(--blue-500);border-color:var(--blue-500);color:var(--surface-0)}
.tbtn.primary svg{color:var(--surface-0)}
.tbtn.primary:hover{background:var(--blue-600)}
.chips{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line-100);background:var(--surface-50)}
.chips.is-empty{display:none}
.chips .lbl{font-size:11px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:var(--space-2);height:26px;padding:0 6px 0 10px;border-radius:var(--radius-pill);background:var(--blue-100);border:1px solid var(--blue-200);color:var(--ink-900);font-size:12px}
.chip .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink-600)}
.chip .x:hover{background:var(--surface-0);color:var(--danger)}
.chip .x svg{width:10px;height:10px}
.clearall{font-size:12px;font-weight:500;color:var(--blue-500);cursor:pointer}
.clearall:hover{color:var(--blue-600);text-decoration:underline}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:var(--blue-100);text-align:left;font-size:12px;font-weight:500;color:var(--ink-900);padding:12px 16px;white-space:nowrap;border-bottom:1px solid var(--line-100)}
thead th .th{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.colrm{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-400)}
.colrm:hover{background:var(--surface-100);color:var(--danger)}
.colrm svg{width:10px;height:10px}
tbody tr.parent{height:var(--table-row-h)}
tbody td{padding:0 16px;border-bottom:1px solid var(--line-100);font-size:12px;color:var(--ink-900);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--blue-tint-08)}
tbody tr.sel{background:var(--blue-tint-08)}
.empty-row td{text-align:center;color:var(--ink-400);padding:30px 16px}
.ck{width:18px;height:18px;border:1.5px solid var(--field-border);border-radius:var(--radius-sm);display:grid;place-items:center;cursor:pointer;background:var(--surface-0)}
.ck.on{background:var(--blue-500);border-color:var(--blue-500)}
.ck svg{width:11px;height:11px;display:none;stroke:var(--surface-0)}
.ck.on svg{display:block}
.colck{width:18px;padding-right:0}
.colexp{width:34px;padding-right:0}
.exp{width:26px;height:26px;border-radius:var(--radius-sm);display:grid;place-items:center;cursor:pointer;color:var(--ink-600);transition:background .12s ease}
.exp:hover{background:var(--surface-100)}
.exp svg{width:16px;height:16px;transition:transform .18s ease}
.exp.open svg{transform:rotate(90deg);color:var(--blue-500)}
tr.parent.open{background:var(--blue-tint-08)}
tr.nested-row td{padding:0;border-bottom:1px solid var(--line-100);background:var(--surface-50)}
.nested-wrap{padding:14px 16px 16px 60px}
.nested-title{font-size:11px;font-weight:600;color:var(--ink-600);text-transform:uppercase;letter-spacing:.04em;margin-bottom:var(--space-2);display:flex;align-items:center;gap:7px}
.nested-title svg{width:13px;height:13px;color:var(--ink-400)}
table.nested{width:100%;border-collapse:collapse;background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-sm);overflow:hidden}
table.nested thead th{background:var(--surface-100);color:var(--ink-600);font-size:11px;font-weight:600;padding:9px 14px;text-align:left;border-bottom:1px solid var(--line-100);white-space:nowrap}
table.nested tbody td{padding:9px 14px;font-size:12px;color:var(--ink-900);border-bottom:1px solid var(--line-100);white-space:nowrap}
table.nested tbody tr:last-child td{border-bottom:0}
table.nested tbody tr:hover{background:var(--blue-tint-08)}
.pid{font-weight:600;color:var(--ink-900)}
.pname{font-size:11px;color:var(--ink-400);margin-top:2px}
.status{font-weight:500}
.link{color:var(--blue-500);font-weight:500;cursor:pointer}
.link:hover{color:var(--blue-600);text-decoration:underline}
.mini-dd{display:inline-flex;align-items:center;justify-content:space-between;gap:var(--space-2);height:30px;min-width:var(--table-rowdd-min);border:1px solid var(--field-border);border-radius:var(--radius-sm);padding:0 9px;color:var(--ink-400);cursor:pointer;font-size:12px}
.mini-dd svg{width:14px;height:14px;color:var(--ink-600)}
.para{color:var(--ink-600);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip{display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kebab{width:28px;height:28px;border-radius:var(--radius-sm);display:grid;place-items:center;cursor:pointer;color:var(--ink-600)}
.kebab:hover{background:var(--surface-100)}
.kebab svg{width:18px;height:18px}
.footer{display:flex;align-items:center;gap:var(--space-3);padding:12px 16px;border-top:1px solid var(--line-100);flex-wrap:wrap}
.selinfo{font-size:12px;color:var(--ink-600)}
.selinfo b{color:var(--ink-900);font-weight:600}
.perview{display:flex;align-items:center;gap:var(--space-2);font-size:11px;color:var(--ink-600)}
.perview .mini-dd{min-width:64px;color:var(--ink-900)}
.pager{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
.pg{min-width:36px;height:36px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-200);border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--ink-900);cursor:pointer;background:transparent}
.pg:hover{border-color:var(--ink-400)}
.pg.on{border-color:var(--blue-500);color:var(--blue-500)}
.pg.dots{border:0;cursor:default}
.pg.pgnav svg{width:14px;height:14px}
.pg.dis{color:var(--ink-400);border-color:var(--line-100);cursor:not-allowed}
.goto{display:flex;align-items:center;gap:var(--space-2);font-size:11px;color:var(--ink-600);margin-left:var(--space-2)}
.goto input{width:48px;height:34px;border:1px solid var(--field-border);border-radius:var(--radius-sm);padding:0 8px;font-size:12px;font-family:var(--font-ui);color:var(--ink-900);background:transparent;outline:none}
.goto input:focus{border-color:var(--field-border-focus)}
.pop{position:fixed;z-index:40;display:none;background:var(--surface-0);border:1px solid var(--line-100);border-radius:var(--radius-sm);box-shadow:var(--field-list-shadow);overflow:hidden;min-width:170px}
.pop.open{display:block}
.pop .pi{height:34px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:12px;color:var(--ink-900);cursor:pointer;border-top:1px solid var(--line-100)}
.pop .pi:first-child{border-top:0}
.pop .pi:hover{background:var(--blue-100)}
.pop .pi svg{width:15px;height:15px;color:var(--ink-600);flex:none}
.pop .pi.danger{color:var(--danger)}
.pop .pi.danger svg{color:var(--danger)}
.sort-ic{display:inline-flex;color:var(--ink-400);margin-left:2px}
.sort-ic svg{width:13px;height:13px}
.sort-ic.on{color:var(--blue-500)}
.tip-pop{position:fixed;z-index:60;display:none;max-width:280px;background:var(--ink-900);color:var(--surface-0);font-size:12px;line-height:16px;padding:6px 10px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);pointer-events:none;white-space:normal}
.tip-pop.on{display:block}
.rmbtn{background:none;border:0;font-family:var(--font-ui);font-size:12px;font-weight:500;color:var(--danger);cursor:pointer;padding:0}
.rmbtn:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){.exp svg{transition:none;animation:none}}
</style>
</helmet>
<div class="panel" id="listView">
  <div class="toolbar">
    <div class="listing" id="listing">Listing <b>0</b> Reseller</div>
    <label class="dt-search">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg>
      <input id="searchInput" placeholder="Search all columns">
    </label>
    <div class="dt-spacer"></div>
    <button class="tbtn" id="statusBtn">All Status <span class="cnt" id="statusCnt"></span><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button>
    <button class="tbtn" id="moreBtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"></path></svg>More Filters</button>
    <button class="tbtn" id="sortBtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h13M3 12h9M3 18h5M18 8V20M18 20l3-3M18 20l-3-3"></path></svg>Sort by Risk</button>
    <button class="tbtn" id="addColBtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>Add Column</button>
    <button class="tbtn" id="nestBtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M8 12h12M12 18h8"></path></svg>Nested View</button>
    <button class="tbtn primary" id="bulkBtn">Bulk Actions<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button>
  </div>
  <div class="chips is-empty" id="chips"></div>
  <div class="table-scroll">
    <table id="table">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="footer">
    <div class="selinfo" id="selInfo"><b>0</b> selected</div>
    <div class="perview"><span class="mini-dd" id="perViewBtn">10<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></span>Per View</div>
    <div class="pager">
      <span class="pg pgnav" id="pgFirst" title="First"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6l-6 6 6 6M11 6l-6 6 6 6"></path></svg></span>
      <span class="pg pgnav" id="pgPrev" title="Previous"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></span>
      <span class="pgNums" id="pgNums"></span>
      <span class="pg pgnav" id="pgNext" title="Next"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></span>
      <span class="pg pgnav" id="pgLast" title="Last"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"></path></svg></span>
      <span class="goto">Go to page <input id="gotoInput" type="number" min="1" max="16" placeholder="1"></span>
    </div>
  </div>
  <div class="pop" id="statusPop"></div>
  <div class="pop" id="morePop"></div>
  <div class="pop" id="rowPop">
    <div class="pi"><svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M16 3l5 5-5 5"></path><path d="M21 8H8M3 16h13"></path></svg>SIM Swap</div>
    <div class="pi"><svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Change Plan</div>
    <div class="pi"><svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"></path></svg>Run Diagnostics</div>
    <div class="pi"><svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"></path></svg>Download Usage Report</div>
    <div class="pi danger"><svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Lock SIM</div>
  </div>
  <div class="pop" id="addColPop"></div>
  <div class="pop" id="cellDdPop"></div>
  <div class="pop" id="perViewPop"></div>
  <div class="tip-pop" id="tipPop"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:640},&quot;defaultPerView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;10&quot;,&quot;options&quot;:[&quot;5&quot;,&quot;10&quot;,&quot;25&quot;,&quot;50&quot;,&quot;100&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Table&quot;}}">
class Component extends DCLogic {
  componentWillUnmount() {
    if (this._onDocClick) document.removeEventListener('click', this._onDocClick);
  }
  componentDidMount() {
    const root = document.getElementById('listView');
    if (!root) return;

    const statusColor = { Active:'var(--success)', Blocked:'var(--danger)', Pending:'var(--alert)' };
    const names = ['Olivia Martin','William Lee','Sara Khan','Arjun Patel','Mei Chen','Diego Lopez','Fatima Noor','Tom Becker','Grace Okoro','Hiroshi Tanaka'];
    const statuses = ['Active','Blocked','Active','Pending','Active','Blocked','Pending','Active','Active','Pending'];
    const planNames = ['Smart 5G 40GB','Voice Plus 10GB','IoT Connect 2GB','Unlimited Pro','Roam Lite 5GB'];
    const DATA = names.map((n,i)=>({
      id:'72836'+(23520+i*7), name:n, status:statuses[i], heading:'Value',
      risk:(23+i*7)%98+2,
      para:'Paragraph text for '+n+' goes here…',
      children: Array.from({length:(i%3)+2}, (_,j)=>({
        msisdn:'+1 415 '+(200+i*11+j)+' '+(1000+i*37+j*13),
        plan: planNames[(i+j)%planNames.length],
        status: statuses[(i+j)%statuses.length],
        usage: ((i*3+j*7)%95+3)+'.'+((i+j)%9)+' GB'
      }))
    }));

    const initPerView = parseInt(this.props.defaultPerView || '10', 10) || 10;
    const state = { search:'', status:'all', tier:null, sortCol:null, sortDir:'asc', nested:false, extraCols:[], rowDD:{}, expanded:new Set(), page:1, totalPages:1, perView:initPerView, sel:new Set() };
    const COL_NAME_OPTIONS = ['Last Active','Region','Connectivity Plan','Balance','Tags'];
    const DEFAULT_COLS = [
      {key:'id',label:'Partner'},{key:'heading',label:'Heading'},{key:'status',label:'Status'},
      {key:'link',label:'Hyperlink'},{key:'dropdown',label:'Dropdown'},{key:'para',label:'Paragraph'},{key:'risk',label:'Risk Score'}
    ];
    function sortVal(r,col){
      switch(col){
        case 'id': return r.id; case 'heading': return r.heading; case 'status': return r.status;
        case 'link': return 'Primary Text Button'; case 'dropdown': return state.rowDD[r.id]||'Select';
        case 'para': return r.para; case 'risk': return r.risk; default: return 'Value';
      }
    }
    function colLabel(key){ const c=DEFAULT_COLS.find(c=>c.key===key); return c?c.label:(key.startsWith('extra:')?key.slice(6):key); }
    const PERVIEW_OPTIONS = [5,10,25,50,100];
    const CELL_DD_OPTIONS = ['Activate','Suspend','Terminate','Transfer'];

    const body = root.querySelector('#body');
    const headRow = root.querySelector('#headRow');
    const listing = root.querySelector('#listing');
    const chips = root.querySelector('#chips');
    const selInfo = root.querySelector('#selInfo');
    const table = root.querySelector('#table');
    const addColPop = root.querySelector('#addColPop');
    const cellDdPop = root.querySelector('#cellDdPop');

    function filtered(){
      let rows = DATA.filter(r=>{
        if(state.status!=='all' && r.status!==state.status) return false;
        if(state.search){ const q=state.search.toLowerCase();
          const hay=[r.id,r.name,r.status,r.heading,r.para,...state.extraCols.map(()=>'Value')].join(' ').toLowerCase();
          if(!hay.includes(q)) return false; }
        return true;
      });
      if(state.sortCol){
        const col=state.sortCol, dir=state.sortDir==='asc'?1:-1;
        rows=[...rows].sort((a,b)=>{
          const va=sortVal(a,col), vb=sortVal(b,col);
          if(typeof va==='number' && typeof vb==='number') return (va-vb)*dir;
          return String(va).localeCompare(String(vb))*dir;
        });
      }
      return rows;
    }
    function paged(){ const rows=filtered(); const start=(state.page-1)*state.perView; return rows.slice(start, start+state.perView); }

    function sortIcon(key){
      const active = state.sortCol===key;
      const path = !active ? '<path d="M8 9l4-4 4 4M8 15l4 4 4-4"/>'
        : (state.sortDir==='asc' ? '<path d="M6 15l6-6 6 6"/>' : '<path d="M6 9l6 6 6-6"/>');
      return '<span class="sort-ic'+(active?' on':'')+'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'+path+'</svg></span>';
    }
    function renderHead(){
      const defaults = DEFAULT_COLS.map(c=>'<th><span class="th" data-sortcol="'+c.key+'">'+c.label+sortIcon(c.key)+'</span></th>').join('');
      let extra=''; state.extraCols.forEach(name=>{ const key='extra:'+name; extra+='<th><span class="th" data-sortcol="'+key+'"><span title="'+name+'">'+name+'</span>'+sortIcon(key)+'<span class="colrm" data-rmcol="'+name+'" title="Remove column"><svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></span></th>'; });
      const rows=paged();
      const allSel = rows.length>0 && rows.every(r=>state.sel.has(r.id));
      const expHead = state.nested ? '<th class="colexp"></th>' : '';
      headRow.innerHTML = expHead +
        '<th class="colck"><span class="ck '+(allSel?'on':'')+'" id="ckAll"><svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span></th>'+
        defaults+extra+'<th>Actions</th>';
      root.querySelector('#ckAll').addEventListener('click', ()=>{
        const rows=paged();
        if(rows.every(r=>state.sel.has(r.id))) rows.forEach(r=>state.sel.delete(r.id));
        else rows.forEach(r=>state.sel.add(r.id));
        render();
      });
      table.style.minWidth = (950 + state.extraCols.length*160 + (state.nested?34:0)) + 'px';
    }

    function nestedTable(r){
      const rowsHtml = r.children.map(c=>(
        '<tr>'+
          '<td style="font-weight:600">'+c.msisdn+'</td>'+
          '<td>'+c.plan+'</td>'+
          '<td><span class="status" style="color:'+statusColor[c.status]+'">'+c.status+'</span></td>'+
          '<td>'+c.usage+'</td>'+
          '<td><span class="link">View</span></td>'+
        '</tr>'
      )).join('');
      return '<div class="nested-wrap">'+
        '<div class="nested-title"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M8 12h12M12 18h8"/></svg>'+r.children.length+' connected SIMs</div>'+
        '<table class="nested"><thead><tr><th>MSISDN</th><th>Plan</th><th>Status</th><th>Data Usage</th><th>Actions</th></tr></thead>'+
        '<tbody>'+rowsHtml+'</tbody></table></div>';
    }

    function renderBody(){
      const rows=paged();
      const totalCols = 9 + state.extraCols.length + (state.nested?1:0);
      if(rows.length===0){ body.innerHTML='<tr class="empty-row"><td colspan="'+totalCols+'">No results found</td></tr>'; return; }
      body.innerHTML = rows.map(r=>{
        const on=state.sel.has(r.id);
        const isOpen=state.expanded.has(r.id);
        let extraCells=''; state.extraCols.forEach(()=>{ extraCells+='<td><span class="clip" data-tip="Value">Value</span></td>'; });
        const ddVal = state.rowDD[r.id] || 'Select';
        const expCell = state.nested ? '<td class="colexp"><span class="exp '+(isOpen?'open':'')+'" data-exp="'+r.id+'"><svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></td>' : '';
        let html = '<tr class="parent'+(on?' sel':'')+(isOpen?' open':'')+'" data-id="'+r.id+'">'+ expCell +
          '<td class="colck"><span class="ck '+(on?'on':'')+'" data-ck="'+r.id+'"><svg fill="none" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span></td>'+
          '<td><div class="pid">'+r.id+'</div><div class="pname" title="'+r.name+'">'+r.name+'</div></td>'+
          '<td><span class="clip" data-tip="'+r.heading+'">'+r.heading+'</span></td>'+
          '<td><span class="status" style="color:'+statusColor[r.status]+'">'+r.status+'</span></td>'+
          '<td><span class="link">Primary Text Button</span></td>'+
          '<td><span class="mini-dd" data-rowdd="'+r.id+'">'+ddVal+'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></td>'+
          '<td><div class="para" data-tip="'+r.para+'">'+r.para+'</div></td>'+
          '<td><span class="clip" data-tip="Risk score '+r.risk+'">'+r.risk+'</span></td>'+ extraCells +
          '<td><span class="kebab" data-kebab="'+r.id+'"><svg fill="none" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg></span></td>'+
        '</tr>';
        if(state.nested && isOpen){
          html += '<tr class="nested-row"><td colspan="'+totalCols+'">'+nestedTable(r)+'</td></tr>';
        }
        return html;
      }).join('');
    }

    function renderChips(){
      const items=[];
      if(state.status!=='all') items.push({k:'status',label:'Status: '+state.status});
      if(state.tier) items.push({k:'tier',label:'Tier: '+state.tier});
      if(state.search) items.push({k:'search',label:'Search: "'+state.search+'"'});
      if(state.sortCol) items.push({k:'sort',label:'Sorted by '+colLabel(state.sortCol)+' ('+(state.sortDir==='asc'?'A–Z':'Z–A')+')'});
      if(items.length===0){ chips.className='chips is-empty'; chips.innerHTML=''; return; }
      chips.className='chips';
      chips.innerHTML='<span class="lbl">Filters</span>'+items.map(it=>
        '<span class="chip">'+it.label+'<span class="x" data-rm="'+it.k+'"><svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></span>'
      ).join('')+'<span class="clearall" id="clearAll">Clear all</span>';
    }

    function renderPager(){
      const nums=root.querySelector('#pgNums');
      const tp=state.totalPages, p=state.page;
      let pages=[];
      if(tp<=5){ for(let i=1;i<=tp;i++) pages.push(i); }
      else {
        pages.push(1);
        if(p>3) pages.push('...');
        for(let i=Math.max(2,p-1);i<=Math.min(tp-1,p+1);i++) pages.push(i);
        if(p<tp-2) pages.push('...');
        pages.push(tp);
      }
      nums.innerHTML=pages.map(n=> n==='...' ? '<span class="pg dots">…</span>'
        : '<span class="pg '+(n===p?'on':'')+'" data-pg="'+n+'">'+n+'</span>').join('');
      root.querySelector('#pgFirst').classList.toggle('dis', p===1);
      root.querySelector('#pgPrev').classList.toggle('dis', p===1);
      root.querySelector('#pgNext').classList.toggle('dis', p===tp);
      root.querySelector('#pgLast').classList.toggle('dis', p===tp);
    }

    function render(){
      state.totalPages = Math.max(1, Math.ceil(filtered().length/state.perView));
      if(state.page>state.totalPages) state.page=state.totalPages;
      renderHead(); renderBody(); renderChips(); renderPager();
      listing.innerHTML='Listing <b>'+filtered().length+'</b> Reseller';
      root.querySelector('#perViewBtn').firstChild.textContent = state.perView;
      const goto=root.querySelector('#gotoInput'); goto.max=state.totalPages;
      root.querySelector('#statusCnt').textContent = state.status==='all' ? '('+DATA.length+')' : '';
      root.querySelector('#bulkBtn').firstChild.textContent = state.sel.size>0 ? 'Bulk Actions ('+state.sel.size+')' : 'Bulk Actions';
      selInfo.innerHTML='<b>'+state.sel.size+'</b> selected';
      root.querySelector('#sortBtn').classList.toggle('active', state.sortCol==='risk');
      root.querySelector('#statusBtn').classList.toggle('active', state.status!=='all');
      root.querySelector('#moreBtn').classList.toggle('active', !!state.tier);
      root.querySelector('#nestBtn').classList.toggle('active', state.nested);
    }

    this._onDocClick = (e)=>{
      const ck=e.target.closest('[data-ck]');
      if(ck){ const id=ck.dataset.ck; state.sel.has(id)?state.sel.delete(id):state.sel.add(id); render(); return; }
      const rmcol=e.target.closest('[data-rmcol]');
      if(rmcol){ const idx=state.extraCols.indexOf(rmcol.dataset.rmcol); if(idx>=0){ state.extraCols.splice(idx,1); render(); } return; }
      const th=e.target.closest('[data-sortcol]');
      if(th){ const key=th.dataset.sortcol; if(state.sortCol===key){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; } else { state.sortCol=key; state.sortDir='asc'; } render(); return; }
      const ex=e.target.closest('[data-exp]');
      if(ex){ const id=ex.dataset.exp; state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id); render(); return; }
      const rm=e.target.closest('[data-rm]');
      if(rm){ const k=rm.dataset.rm; if(k==='status')state.status='all'; if(k==='tier')state.tier=null; if(k==='search'){state.search='';root.querySelector('#searchInput').value='';} if(k==='sort'){state.sortCol=null;} render(); return; }
      if(e.target.id==='clearAll'){ state.status='all'; state.tier=null; state.search=''; state.sortCol=null; root.querySelector('#searchInput').value=''; render(); return; }
      const kb=e.target.closest('[data-kebab]');
      if(kb){ openPop(rowPop, kb); e.stopPropagation(); return; }
      const rdd=e.target.closest('[data-rowdd]');
      if(rdd){
        const id=rdd.dataset.rowdd;
        cellDdPop.innerHTML=CELL_DD_OPTIONS.map(o=>'<div class="pi" data-cellval="'+id+'|'+o+'">'+o+'</div>').join('');
        openPop(cellDdPop, rdd); e.stopPropagation(); return;
      }
      const pg=e.target.closest('[data-pg]');
      if(pg){ state.page=parseInt(pg.dataset.pg,10); render(); return; }
      [statusPop,morePop,rowPop,addColPop,cellDdPop,perViewPop].forEach(p=>{ if(!p.contains(e.target)) p.classList.remove('open'); });
    };
    document.addEventListener('click', this._onDocClick);

    root.querySelector('#pgFirst').addEventListener('click',()=>{ state.page=1; render(); });
    root.querySelector('#pgPrev').addEventListener('click',()=>{ if(state.page>1){state.page--; render();} });
    root.querySelector('#pgNext').addEventListener('click',()=>{ if(state.page<state.totalPages){state.page++; render();} });
    root.querySelector('#pgLast').addEventListener('click',()=>{ state.page=state.totalPages; render(); });
    root.querySelector('#gotoInput').addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){ let v=parseInt(e.target.value,10); if(v>=1&&v<=state.totalPages){ state.page=v; render(); } e.target.value=''; }
    });
    cellDdPop.addEventListener('click',(e)=>{ const i=e.target.closest('[data-cellval]'); if(i){ const [id,val]=i.dataset.cellval.split('|'); state.rowDD[id]=val; cellDdPop.classList.remove('open'); render(); } });

    root.querySelector('#searchInput').addEventListener('input', (e)=>{ state.search=e.target.value.trim(); state.page=1; render(); });

    root.querySelector('#sortBtn').addEventListener('click', ()=>{ if(state.sortCol==='risk'){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; } else { state.sortCol='risk'; state.sortDir='desc'; } render(); });

    root.querySelector('#nestBtn').addEventListener('click', ()=>{ state.nested=!state.nested; if(!state.nested) state.expanded.clear(); render(); });

    function renderAddColPop(){
      addColPop.innerHTML = COL_NAME_OPTIONS.map(n=>{
        const added = state.extraCols.includes(n);
        const icon = added
          ? '<svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'
          : '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
        return '<div class="pi" data-togglecol="'+n+'" style="justify-content:space-between"><span style="display:inline-flex;align-items:center;gap:10px">'+icon+n+'</span>'+
          (added ? '<button class="rmbtn">Remove</button>' : '')+'</div>';
      }).join('');
    }
    root.querySelector('#addColBtn').addEventListener('click', (e)=>{
      e.stopPropagation();
      renderAddColPop();
      openPop(addColPop, e.currentTarget);
    });
    addColPop.addEventListener('click',(e)=>{ const i=e.target.closest('[data-togglecol]'); if(i){ e.stopPropagation(); const n=i.dataset.togglecol; const idx=state.extraCols.indexOf(n); if(idx>=0) state.extraCols.splice(idx,1); else state.extraCols.push(n); render(); renderAddColPop(); } });

    const statusPop=root.querySelector('#statusPop');
    const morePop=root.querySelector('#morePop');
    const rowPop=root.querySelector('#rowPop');
    const perViewPop=root.querySelector('#perViewPop');
    function openPop(pop, anchor){
      [statusPop,morePop,rowPop,addColPop,cellDdPop,perViewPop].forEach(p=>{ if(p!==pop) p.classList.remove('open'); });
      const r=anchor.getBoundingClientRect();
      pop.classList.toggle('open');
      if(!pop.classList.contains('open')) return;
      const w=pop.getBoundingClientRect().width, h=pop.getBoundingClientRect().height;
      pop.style.left=Math.min(r.left, window.innerWidth-w-12)+'px';
      pop.style.top=(r.bottom+6+h>window.innerHeight ? r.top-h-6 : r.bottom+6)+'px';
    }

    perViewPop.innerHTML=PERVIEW_OPTIONS.map(n=>'<div class="pi" data-pv="'+n+'">'+n+'</div>').join('');
    perViewPop.addEventListener('click',(e)=>{ const i=e.target.closest('[data-pv]'); if(i){ state.perView=parseInt(i.dataset.pv,10); state.page=1; perViewPop.classList.remove('open'); render(); } });
    root.querySelector('#perViewBtn').addEventListener('click',(e)=>{ e.stopPropagation(); openPop(perViewPop, e.currentTarget); });

    statusPop.innerHTML=['all','Active','Blocked','Pending'].map(s=>'<div class="pi" data-st="'+s+'">'+(s==='all'?'All Status':s)+'</div>').join('');
    statusPop.addEventListener('click',(e)=>{ const i=e.target.closest('[data-st]'); if(i){ state.status=i.dataset.st; state.page=1; statusPop.classList.remove('open'); render(); } });
    root.querySelector('#statusBtn').addEventListener('click',(e)=>{ e.stopPropagation(); openPop(statusPop, e.currentTarget); });

    morePop.innerHTML=['MVNO','Reseller','Enterprise'].map(t=>'<div class="pi" data-tier="'+t+'">Tier: '+t+'</div>').join('');
    morePop.addEventListener('click',(e)=>{ const i=e.target.closest('[data-tier]'); if(i){ state.tier=i.dataset.tier; state.page=1; morePop.classList.remove('open'); render(); } });
    root.querySelector('#moreBtn').addEventListener('click',(e)=>{ e.stopPropagation(); openPop(morePop, e.currentTarget); });

    rowPop.addEventListener('click',(e)=>{ if(e.target.closest('.pi')) rowPop.classList.remove('open'); });
    root.querySelector('#bulkBtn').addEventListener('click',(e)=>{ e.stopPropagation(); openPop(rowPop, e.currentTarget); });

    const tipPop=root.querySelector('#tipPop');
    table.addEventListener('mouseover',(e)=>{
      const el=e.target.closest('[data-tip]');
      if(!el || el.scrollWidth<=el.clientWidth){ tipPop.classList.remove('on'); return; }
      tipPop.textContent=el.getAttribute('data-tip');
      tipPop.classList.add('on');
      const r=el.getBoundingClientRect(), w=tipPop.offsetWidth, h=tipPop.offsetHeight;
      tipPop.style.left=Math.min(r.left, window.innerWidth-w-12)+'px';
      tipPop.style.top=(r.bottom+6+h>window.innerHeight ? r.top-h-6 : r.bottom+6)+'px';
    });
    table.addEventListener('mouseout',(e)=>{ if(!e.relatedTarget || !e.relatedTarget.closest('[data-tip]')) tipPop.classList.remove('on'); });

    render();
  }
}
</script>
</body>
</html>
