<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="../../styles.css" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:var(--surface-0);color:var(--ink-900)}
.card{padding:24px;display:flex;flex-direction:column;gap:var(--space-4)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(220px,300px));gap:22px 28px;align-items:start}
.ttl{font:var(--t-tiny);color:var(--ink-400);text-transform:uppercase;letter-spacing:.04em}
pre{margin:0;padding:12px 14px;background:var(--surface-50);border:1px solid var(--line-100);border-radius:var(--radius-sm);font-size:11px;color:var(--ink-700);overflow-x:auto}
</style></head><body>
<div class="card">
  <div class="ttl">States</div>
  <div id="root" class="grid"></div>
  <div class="ttl">Usage</div>
<pre>const { InputField } = window.Ds6DTechnologiesONEUIDesignSystem_9f23d5;

&lt;InputField label="Reseller Name" value={name} onChange={setName}
            placeholder="Enter name" /&gt;
&lt;InputField label="Contact Email" error="Enter a valid email address" /&gt;</pre>
</div>
<script>
window.addEventListener('load', () => {
  const ns = window.Ds6DTechnologiesONEUIDesignSystem_9f23d5 || {};
  const { InputField } = ns;
  if (!InputField) { document.getElementById('root').textContent = 'Bundle not compiled yet.'; return; }
  const e = React.createElement;
  function Demo() {
    const [v, setV] = React.useState('Airtel Retail North');
    return e(React.Fragment, null,
      e(InputField, { label: 'Default', placeholder: 'Placeholder' }),
      e(InputField, { label: 'With value (type to clear)', value: v, onChange: setV }),
      e(InputField, { label: 'Error / validation', defaultValue: 'Short', error: 'Minimum value should be 10 characters long' }),
      e(InputField, { label: 'Disabled', defaultValue: 'Disabled Value', disabled: true })
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
});
</script>
</body></html>
